name: policies-ci

# Repo-wide policy nets that span every app: naming, file size, color literals, i18n parity and
# module boundaries. Each app also has its own stricter checks in its own workflow; these are the
# floor. Cheap (no toolchains besides bash/node/go), so they run on every PR.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: policies-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  naming:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: bash scripts/check-naming.sh

  file-size:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Fails on any hand-written file over 500 lines; prints yellow/orange offenders (CONVENTIONS.md, "File size").
      - run: bash scripts/check-file-size.sh

  color-literals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: node scripts/check-color-literals.mjs

  i18n-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: node scripts/check-i18n-parity.mjs

  boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - run: bash scripts/check-boundaries.sh

  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.6.0
      - run: pnpm install --frozen-lockfile --ignore-workspace
        working-directory: scripts
      - run: node scripts/check-features.mjs
      - run: node scripts/check-behavior-fixtures.mjs

  docs-links:
    # Relative markdown links, repo paths mentioned in scripts and workflows (including the paths
    # in AI review prompts under docs/agent/review/), and the no-Cyrillic rule.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: node scripts/check-docs.mjs

  renovate-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      # renovate 44.146.3 is the newest git tag of renovatebot/renovate (npm registry not reachable
      # when this was written: UNVERIFIED on npm). Renovate bumps it itself via the npm manager only
      # if it is declared in a package.json; until then, bump by hand.
      - run: npx --yes --package renovate@44.147.0 renovate-config-validator --strict renovate.json

  secrets:
    # Secret scanning over full history. Config and documented placeholders: .gitleaks.toml.
    # The tool version is pinned in mise.toml (gitleaks); the action ships its own binary.
    # gitleaks-action v2 needs a GITLEAKS_LICENSE secret when the repo belongs to an organization
    # (free for personal accounts): https://gitleaks.io
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_CONFIG: .gitleaks.toml
