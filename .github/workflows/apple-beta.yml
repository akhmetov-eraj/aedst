name: apple-beta

# Manual only (`workflow_dispatch`) — never triggered by a push, PR, or
# Issue automation, so an AI agent's normal pipeline can never reach this.
# A human runs it from the Actions tab. Needs these repo secrets, none of
# which this repo's AI agent has access to (.claude/settings.json):
# MATCH_PASSWORD, MATCH_GIT_BASIC_AUTHORIZATION (or an SSH key for the
# match repo, depending how it's set up), APP_STORE_CONNECT_API_KEY_*.
on:
  workflow_dispatch: {}

defaults:
  run:
    working-directory: apps/apple

jobs:
  beta:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          working_directory: apps/apple
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: apps/apple
          bundler-cache: true
      - run: bundle exec fastlane beta
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
