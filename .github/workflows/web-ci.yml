name: web-ci

on:
  push:
    branches: [main]
    # The TypeScript client is generated from apps/server's protos, so a
    # contract change must re-run this pipeline (codegen, contract test).
    paths:
      ["apps/web/**", "apps/server/api/proto/**", ".github/workflows/web-ci.yml"]
  pull_request:
    paths:
      ["apps/web/**", "apps/server/api/proto/**", ".github/workflows/web-ci.yml"]
  # Nightly full browser matrix (see the e2e-plan job); also runnable by hand.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/web

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "12.6.0"
  # The e2e/Lighthouse servers listen here; NEXT_PUBLIC_* is inlined at build
  # time, so the build must already know the origin it will be served from.
  SITE_URL: http://127.0.0.1:3100

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm lint` is `biome check --error-on-warnings`: the mandatory-library
      # rules (noProcessEnv, restricted imports/elements, GritQL plugins in
      # apps/web/lint, naming, import cycles) are all Biome diagnostics.
      - name: Biome (lint + format check; Biome only, no ESLint/Prettier)
        run: pnpm lint

      # dependency-cruiser: import direction app -> modules -> shared, no cycles,
      # public entry only, no orphans (apps/web/.dependency-cruiser.cjs).
      - name: Import graph (dependency-cruiser)
        run: pnpm check:deps

      - name: Import graph artifact
        if: ${{ !cancelled() }}
        run: |
          sudo apt-get install -y --no-install-recommends graphviz >/dev/null
          pnpm check:deps:graph
          dot -Tsvg dep-graph.dot -o dep-graph.svg

      - name: Upload import graph
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-dep-graph
          path: apps/web/dep-graph.svg
          retention-days: 7

      - name: Feature module boundaries
        run: pnpm check:feature-boundaries

      - name: Forms use React Hook Form
        run: pnpm check:forms

      - name: No color literals or Tailwind palette classes
        run: pnpm check:colors

      # Negative self-test: every gate above must FAIL on its broken fixture
      # (apps/web/lint/fixtures), so a gate that silently stopped working is caught.
      - name: Gate self-test
        run: pnpm check:selftest

      # Generated ConnectRPC stubs are gitignored/generated; knip needs them
      # to resolve imports.
      - name: Generate ConnectRPC client stubs
        run: pnpm connect:generate

      - name: knip (unused files/exports/deps)
        run: pnpm knip

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate ConnectRPC client stubs
        run: pnpm connect:generate

      # The generated stubs directory is gitignored, so a `git diff` on it can
      # never fail. Drift against apps/server/api/proto is caught here instead:
      # the type check below breaks on a removed/renamed message, and the
      # contract test (unit job) checks the mock API against the descriptors.

      # `next typegen` emits the route types (PageProps, RouteContext, …) the
      # source relies on, which a plain `tsc` on a fresh checkout would miss.
      - name: Generate Next.js route types
        run: pnpm exec next typegen

      - name: Type check
        run: pnpm typecheck

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate ConnectRPC client stubs
        run: pnpm connect:generate

      # Component tests run in real Chromium (Vitest Browser Mode, project
      # "browser" in vitest.config.mts); the pure-logic project needs nothing.
      - name: Install Playwright Chromium (Vitest browser mode)
        run: pnpm exec playwright install --with-deps chromium

      # The Playwright mock API must match the proto contract: every mocked
      # procedure exists in the generated descriptors and its responses parse
      # strictly as the declared messages (src/test/contract). Run on its own
      # first so a contract drift is named as such in the PR checks.
      - name: Contract test (e2e mock API vs proto descriptors)
        run: pnpm test:contract

      # Fails when coverage drops under the thresholds in vitest.config.mts.
      - name: Unit + integration tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-coverage
          path: apps/web/coverage/
          retention-days: 7

  # Nightly mutation testing of the pure-logic core (stryker.config.mjs). Not per PR.
  mutation:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate ConnectRPC client stubs
        run: pnpm connect:generate

      # Fails below thresholds.break in stryker.config.mjs.
      - name: Stryker mutation run
        run: pnpm test:mutation

      - name: Upload mutation report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-mutation-report
          path: apps/web/reports/mutation/
          retention-days: 14

  # Storybook stories of src/shared/ui in real Chromium: smoke render + axe via
  # the a11y addon (`a11y.test: "error"` in .storybook/preview.tsx), so an
  # accessibility violation fails the job.
  stories:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate ConnectRPC client stubs
        run: pnpm connect:generate

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Story tests (smoke + a11y)
        run: pnpm test:stories

  # Known-vulnerable production dependencies (npm advisory DB). Scheduled runs
  # catch advisories published after a merge, not only changes in a PR.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: pnpm audit (production, high and critical)
        run: pnpm audit --prod --audit-level=high

  # Blocks pull requests that add a dependency with a known high-severity
  # vulnerability or a disallowed license. Needs the repository's dependency
  # graph enabled (Settings > Code security); a no-op for non-PR events.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, typecheck, unit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate ConnectRPC client stubs
        run: pnpm connect:generate

      # Next.js incremental build cache (SWC/webpack/turbopack output). Keyed on
      # the lockfile; restore-keys fall back to the newest cache of this lock.
      - name: Cache Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('apps/web/pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**', 'apps/web/next.config.*') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('apps/web/pnpm-lock.yaml') }}-

      # Test build only: it is never deployed, so it must not upload source
      # maps (they would belong to no running code). web-release.yml builds
      # the deployed image and is the only place that uploads them.
      - name: Build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ env.SITE_URL }}
        run: pnpm build

      # Performance budget: fails the PR that adds the weight.
      - name: Client bundle budget
        run: pnpm check:bundle

      # Defence in depth: no source map may be served publicly, whether or
      # not the Sentry upload ran.
      - name: No public source maps
        run: |
          if find .next/static -name "*.map" | grep -q .; then
            echo "::error::source maps found under .next/static"; exit 1
          fi

      - name: Upload build for the e2e and Lighthouse jobs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-build
          path: |
            apps/web/.next
            !apps/web/.next/cache
          include-hidden-files: true
          retention-days: 1

  # Pull requests run the two engines that cover the most risk (Blink on
  # desktop, WebKit on a touch phone: iOS Safari is the strictest target in
  # the browserslist baseline). Pushes to main, the nightly schedule and manual
  # runs run all five projects of playwright.config.ts.
  e2e-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        working-directory: .
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo 'matrix={"include":[{"project":"chromium","browser":"chromium"},{"project":"mobile-safari","browser":"webkit"}]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"include":[{"project":"chromium","browser":"chromium"},{"project":"firefox","browser":"firefox"},{"project":"webkit","browser":"webkit"},{"project":"mobile-chrome","browser":"chromium"},{"project":"mobile-safari","browser":"webkit"}]}' >> "$GITHUB_OUTPUT"
          fi

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build, e2e-plan]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.e2e-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate ConnectRPC client stubs
        run: pnpm connect:generate

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-build
          path: apps/web/.next

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      # Playwright starts two servers itself (see playwright.config.ts):
      # `next start` on the build above, and e2e/mock-api — an in-memory
      # stand-in for apps/server — so the flows behind authentication (login,
      # token refresh, dashboard, filters, pagination, CRUD) run without a
      # database or the Go service.
      - name: Playwright e2e (${{ matrix.project }})
        env:
          CI: "1"
          NEXT_PUBLIC_SITE_URL: ${{ env.SITE_URL }}
        run: pnpm exec playwright test --project=${{ matrix.project }}

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-${{ matrix.project }}
          path: apps/web/playwright-report/
          retention-days: 7

  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate ConnectRPC client stubs
        run: pnpm connect:generate

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-build
          path: apps/web/.next

      # Budgets for Core Web Vitals, category scores (a11y = 100) and script
      # weight live in lighthouserc.json. The pages audited are public, so no
      # backend is needed.
      - name: Lighthouse CI
        env:
          NEXT_PUBLIC_SITE_URL: ${{ env.SITE_URL }}
        run: pnpm lighthouse

      - name: Upload Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lighthouse-reports
          path: apps/web/.lighthouseci/
          retention-days: 7

      # Signed-in pages (/en/tasks, /en/tasks/new): the script starts the e2e
      # mock API (also the OIDC provider) and the server, signs a seeded user
      # in with Playwright and audits with the session cookies as a header.
      - name: Install Playwright Chromium (sign-in for the audit)
        run: pnpm exec playwright install --with-deps chromium

      - name: Lighthouse CI (signed-in pages)
        run: pnpm lighthouse:signed-in

      - name: Upload signed-in Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lighthouse-signed-in-reports
          path: apps/web/.lighthouseci-signed-in/
          retention-days: 7
