name: web-ci

on:
  push:
    branches: [main]
    paths: ["apps/web/**", ".github/workflows/web-ci.yml"]
  pull_request:
    paths: ["apps/web/**", ".github/workflows/web-ci.yml"]

defaults:
  run:
    working-directory: apps/web

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "12.6.0"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome (lint + format check)
        run: pnpm lint

      - name: Feature module boundaries
        run: pnpm check:feature-boundaries

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate ConnectRPC client stubs
        run: pnpm connect:generate

      - name: Verify generated stubs are up to date
        run: git diff --exit-code -- src/shared/api/connect/generated || (echo "::error::apps/web/src/shared/api/connect/generated is out of date relative to apps/server/api/proto — run 'pnpm connect:generate' and commit the result" && exit 1)

      - name: Type check
        run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate ConnectRPC client stubs
        run: pnpm connect:generate

      - name: Unit tests
        run: pnpm test

  build:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate ConnectRPC client stubs
        run: pnpm connect:generate

      - name: Build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate ConnectRPC client stubs
        run: pnpm connect:generate

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # No apps/server backend is available in this job, so this only
      # exercises pages that don't require a live ConnectRPC call (the login
      # form on / renders fine; it just isn't submitted).
      - name: Playwright e2e tests
        env:
          CI: "1"
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
        run: pnpm test:e2e:prod

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
