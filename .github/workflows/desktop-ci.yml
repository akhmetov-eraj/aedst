name: desktop-ci

on:
  push:
    branches: [main]
    paths: ["apps/desktop/**", "apps/server/api/proto/**", "apps/server/buf.lock", ".github/workflows/desktop-ci.yml"]
  pull_request:
    paths: ["apps/desktop/**", "apps/server/api/proto/**", "apps/server/buf.lock", ".github/workflows/desktop-ci.yml"]

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/desktop
    shell: bash

env:
  CMAKE_VERSION: "3.30.5"
  CLANG_FORMAT_VERSION: "18"
  # Qt comes from official binaries via aqtinstall (install-qt-action), never
  # from a package manager. The version is read from apps/desktop/qt-version.txt
  # (single source of truth, also enforced by cmake/AedstQtVersion.cmake).
  # C++ libraries come from vcpkg manifest mode (vcpkg.json) with the GitHub
  # Actions binary cache. See docs/adr/0002-dependency-management.md.
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: bufbuild/buf-setup-action@v1

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format-${{ env.CLANG_FORMAT_VERSION }}

      - name: clang-format
        run: |
          find Modules App -type f \( -name '*.hpp' -o -name '*.cpp' \) -print0 \
            | xargs -0 clang-format-${{ env.CLANG_FORMAT_VERSION }} --dry-run --Werror

      - name: Feature target boundaries
        run: ./scripts/check-feature-boundaries.sh

      # The message types are generated from the protos at build time; the
      # hand-written procedure table (Contract/methods.hpp) must list exactly
      # the RPCs declared in apps/server/api/proto.
      - name: Proto freshness (procedure table vs protos)
        run: ./scripts/check-proto-freshness.sh

      # third_party/protovalidate must match the commit pinned in
      # apps/server/buf.lock (needs buf + network).
      - name: Protovalidate pin
        run: ./scripts/check-protovalidate-pin.sh

  test:
    needs: [lint]
    name: test (${{ matrix.preset }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { preset: msvc-debug, os: windows-latest }
          - { preset: gcc-debug, os: ubuntu-latest }
          - { preset: clang-debug, os: ubuntu-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: ${{ env.CMAKE_VERSION }}

      - name: Install system GL/xkb headers Qt needs
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libegl1

      # Ninja + MSVC: put cl.exe and the Windows SDK on PATH.
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Read pinned Qt version
        run: echo "QT_VERSION=$(tr -d '[:space:]' < qt-version.txt)" >> "$GITHUB_ENV"

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      - name: Set up vcpkg binary caching
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Point VCPKG_ROOT at the runner's vcpkg
        run: echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"

      - name: Configure (vcpkg manifest install runs here)
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      # Non-fatal until the tree has had a real clang-tidy pass — see
      # apps/desktop/CLANG_TIDY_BASELINE.md for the flip condition and owner.
      - name: clang-tidy
        if: matrix.preset == 'gcc-debug'
        continue-on-error: true
        run: |
          sudo apt-get install -y clang-tidy
          run-clang-tidy -p build/${{ matrix.preset }} -quiet 'Modules/|App/' 2>&1 | tee clang-tidy.log

      - uses: actions/upload-artifact@v4
        if: matrix.preset == 'gcc-debug'
        with:
          name: clang-tidy-log
          path: apps/desktop/clang-tidy.log
          if-no-files-found: warn

      - name: Test
        run: ctest --preset ${{ matrix.preset }}
        env:
          QT_QPA_PLATFORM: offscreen

  build:
    needs: [lint, test]
    name: build (${{ matrix.preset }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { preset: msvc-release, os: windows-latest, cpack: "NSIS;ZIP" }
          - { preset: gcc-release, os: ubuntu-latest, cpack: "DEB;TGZ" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: ${{ env.CMAKE_VERSION }}

      - name: Install system GL/xkb headers Qt needs
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libegl1

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Read pinned Qt version
        run: echo "QT_VERSION=$(tr -d '[:space:]' < qt-version.txt)" >> "$GITHUB_ENV"

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      - name: Set up vcpkg binary caching
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Point VCPKG_ROOT at the runner's vcpkg
        run: echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Package (cpack)
        working-directory: apps/desktop/build/${{ matrix.preset }}
        run: cpack -G "${{ matrix.cpack }}"

      - uses: actions/upload-artifact@v4
        with:
          name: aedst-desktop-${{ runner.os }}
          path: apps/desktop/build/${{ matrix.preset }}/packages/*
          if-no-files-found: error

  # Explicit scope cuts, not wired here yet:
  # - Code signing: Authenticode for the NSIS installer and MSIX signing need a
  #   real certificate (secret); `package_msix` is unsigned and not run in CI.
  # - Flatpak / AppImage: need flatpak-builder + KDE runtime / linuxdeploy and
  #   real icon assets (see apps/desktop/App/resources/icons/README.md).
  # - macOS: builds in principle (MACOSX_BUNDLE), but no runner, packaging, or
  #   notarization is set up.
