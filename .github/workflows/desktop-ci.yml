name: desktop-ci

on:
  push:
    branches: [main]
    paths: ["apps/desktop/**", "apps/server/api/proto/**", ".github/workflows/desktop-ci.yml"]
  pull_request:
    paths: ["apps/desktop/**", "apps/server/api/proto/**", ".github/workflows/desktop-ci.yml"]

concurrency:
  group: desktop-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/desktop

env:
  CMAKE_VERSION: "3.30.5"
  CONAN_VERSION: "2.8.1"
  # Qt comes from the Qt installer (via install-qt-action), not Conan — see
  # apps/desktop/conanfile.py and docs/architecture-desktop.md.
  QT_VERSION: "6.8.*"
  CLANG_FORMAT_VERSION: "18"
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # check-proto-freshness.sh diffs against the base/before commit,
          # which needs real history, not a 1-commit shallow clone.
          fetch-depth: 0

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format-${{ env.CLANG_FORMAT_VERSION }}

      - name: clang-format
        run: |
          find Modules App -type f \( -name '*.hpp' -o -name '*.cpp' \) -print0 \
            | xargs -0 clang-format-${{ env.CLANG_FORMAT_VERSION }} --dry-run --Werror

      - name: Feature target boundaries
        run: ./scripts/check-feature-boundaries.sh

      # apps/desktop has no buf/protoc codegen step (see
      # docs/content/architecture-desktop.md, "Networking: Connect over Qt
      # Network, no codegen") — DTOs/procedure paths under
      # Modules/Core/Network are hand-mirrored from apps/server/api/proto
      # instead of generated. This is the desktop equivalent of apps/web's
      # `pnpm connect:generate && git diff --exit-code`: it can't regenerate
      # anything, but it catches the same failure mode — a proto change that
      # ships without the matching client-side update.
      - name: Proto freshness for hand-mirrored DTOs
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          else
            range="${{ github.event.before }}...${{ github.event.after }}"
          fi
          ./scripts/check-proto-freshness.sh "$range"

      # clang-tidy needs compile_commands.json from a configured build (Qt +
      # Conan deps resolved), so it runs in the `test` job right after the
      # debug configure/build instead of here.

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: ${{ env.CMAKE_VERSION }}

      - name: Install system GL/xkb headers Qt needs
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libegl1

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Conan
        run: |
          pip install "conan==${{ env.CONAN_VERSION }}"
          conan profile detect --force

      - uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-${{ runner.os }}-debug-${{ hashFiles('apps/desktop/conanfile.py') }}

      - name: Conan install (Debug)
        run: conan install . --output-folder=build --build=missing -s build_type=Debug

      - name: Configure
        run: cmake --preset debug

      - name: Build
        run: cmake --build --preset debug

      # Non-fatal until the tree has had a real clang-tidy pass — see
      # apps/desktop/CLANG_TIDY_BASELINE.md for the exact flip condition and
      # who owns it. The log is uploaded so the remaining warning count is
      # visible on every run instead of silently rotting.
      - name: clang-tidy
        continue-on-error: true
        run: |
          sudo apt-get install -y clang-tidy
          run-clang-tidy -p build/debug -quiet 'Modules/|App/' 2>&1 | tee clang-tidy.log

      - uses: actions/upload-artifact@v4
        with:
          name: clang-tidy-log
          path: apps/desktop/clang-tidy.log
          if-no-files-found: warn

      - name: Test
        run: ctest --preset debug
        env:
          QT_QPA_PLATFORM: offscreen

  build:
    needs: [lint, test]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: ${{ env.CMAKE_VERSION }}

      - name: Install system GL/xkb headers Qt needs
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libegl1

      # Ninja + MSVC: put cl.exe and the Windows SDK on PATH.
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Conan
        run: |
          pip install "conan==${{ env.CONAN_VERSION }}"
          conan profile detect --force

      - uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-${{ runner.os }}-release-${{ hashFiles('apps/desktop/conanfile.py') }}

      - name: Conan install (Release)
        run: conan install . --output-folder=build --build=missing -s build_type=Release

      - name: Configure
        run: cmake --preset release

      - name: Build
        run: cmake --build --preset release

      - name: Package (Windows, NSIS + ZIP)
        if: runner.os == 'Windows'
        working-directory: apps/desktop/build/release
        run: cpack -G "NSIS;ZIP"

      - name: Package (Linux, DEB + TGZ)
        if: runner.os == 'Linux'
        working-directory: apps/desktop/build/release
        run: cpack -G "DEB;TGZ"

      - uses: actions/upload-artifact@v4
        with:
          name: aedst-desktop-${{ runner.os }}
          path: apps/desktop/build/release/packages/*
          if-no-files-found: error

  # Explicit scope cuts, not wired here yet:
  # - Code signing: Authenticode for the NSIS installer and MSIX signing both
  #   need a real certificate (secret) whose subject matches the MSIX Publisher;
  #   `package_msix` produces an unsigned package and isn't run in CI.
  # - Flatpak / AppImage: `package_flatpak` needs flatpak-builder + the KDE
  #   runtime, `package_appimage` needs linuxdeploy and real icon assets (see
  #   apps/desktop/App/resources/icons/README.md). Publishing to a Flatpak
  #   repo/Flathub is a separate follow-up.
  # - macOS: builds in principle (MACOSX_BUNDLE), but no runner, packaging, or
  #   notarization is set up.
