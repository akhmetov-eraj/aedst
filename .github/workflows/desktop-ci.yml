name: desktop-ci

on:
  push:
    branches: [main]
    paths: ["apps/desktop/**", "apps/server/api/proto/**", "apps/server/buf.lock", ".github/workflows/desktop-ci.yml", "scripts/check-naming.sh"]
  pull_request:
    paths: ["apps/desktop/**", "apps/server/api/proto/**", "apps/server/buf.lock", ".github/workflows/desktop-ci.yml", "scripts/check-naming.sh"]
  workflow_dispatch:

# Least privilege: nothing here writes to the repo, packages or the API.
permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/desktop
    shell: bash

env:
  CMAKE_VERSION: "3.30.5"
  CLANG_FORMAT_VERSION: "18"
  # Qt comes from official binaries via aqtinstall (install-qt-action), never
  # from a package manager. The version is read from apps/desktop/qt-version.txt
  # (single source of truth, also enforced by cmake/AedstQtVersion.cmake).
  # C++ libraries come from vcpkg manifest mode (vcpkg.json) with a file-based binary
  # cache persisted by actions/cache (the x-gha provider depended on the retired GitHub
  # cache v1 API). See docs/adr/0002-dependency-management.md.
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-binary-cache,readwrite"
  # Headless Qt Quick (QtQuickTest + offscreen QPA) on GPU-less runners.
  QT_QUICK_BACKEND: software

jobs:
  # ---------------------------------------------------------------------------
  # Fast static checks. No build tree needed.
  # ---------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: bufbuild/buf-setup-action@v1

      - name: Install clang-format and Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-${{ env.CLANG_FORMAT_VERSION }} libgl1 libxkbcommon0 libegl1 libfontconfig1

      # qmllint/qmlformat ship with Qt (never from apt).
      - name: Read pinned Qt version
        run: echo "QT_VERSION=$(tr -d '[:space:]' < qt-version.txt)" >> "$GITHUB_ENV"

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          # Add-on module for Aedst::Media (MediaPlayer, VideoOutput, QVideoSink).
          modules: qtmultimedia
          cache: true

      - name: clang-format
        run: bash ./scripts/check-format.sh
        env:
          CLANG_FORMAT_VERSION: ${{ env.CLANG_FORMAT_VERSION }}

      - name: File naming (apps/desktop only)
        run: bash ./scripts/check-naming.sh

      - name: C++ subset (features all compilers support)
        run: bash ./scripts/check-cxx-subset.sh

      - name: Feature target boundaries
        run: bash ./scripts/check-feature-boundaries.sh

      # The message types are generated from the protos at build time; the
      # hand-written procedure table (Contract/methods.hpp) must list exactly
      # the RPCs declared in apps/server/api/proto.
      - name: Proto freshness (procedure table vs protos)
        run: bash ./scripts/check-proto-freshness.sh

      # third_party/protovalidate must match the commit pinned in
      # apps/server/buf.lock (needs buf + network).
      - name: Protovalidate pin
        run: bash ./scripts/check-protovalidate-pin.sh

      # Blocking. Without a build tree first-party QML imports are downgraded via
      # .qmllint.ini; the `test (gcc-debug)` job re-runs it with the generated modules.
      - name: qmllint
        run: bash ./scripts/check-qml-lint.sh

      # Advisory until the tree has had one `qmlformat -i` pass.
      - name: qmlformat (advisory)
        continue-on-error: true
        run: bash ./scripts/check-qml-lint.sh --format

  # ---------------------------------------------------------------------------
  # Build + test matrix. kind=test: normal debug builds (warnings are errors);
  # kind=sanitize: ASan/UBSan/TSan presets; kind=coverage: gcov + gcovr report.
  # Every kind runs ALL ctest labels (unit, qttest, qmltest).
  # ---------------------------------------------------------------------------
  test:
    needs: [lint]
    name: ${{ matrix.kind }} (${{ matrix.preset }})
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { preset: msvc-debug, os: windows-latest, kind: test }
          - { preset: gcc-debug, os: ubuntu-latest, kind: test }
          - { preset: clang-debug, os: ubuntu-latest, kind: test }
          - { preset: gcc-asan, os: ubuntu-latest, kind: sanitize }
          - { preset: clang-asan, os: ubuntu-latest, kind: sanitize }
          - { preset: clang-tsan, os: ubuntu-latest, kind: sanitize }
          - { preset: coverage, os: ubuntu-latest, kind: coverage }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: ${{ env.CMAKE_VERSION }}

      # GL/xkb/EGL: Qt runtime. libsecret + dbus: AedstPlatform (Linux secret service,
      # notifications, autostart). clang sanitizer runtimes: libclang-rt-dev
      # (UNVERIFIED that the runner's preinstalled clang major matches the apt default).
      - name: Install system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libegl1 libfontconfig1 \
            libsecret-1-dev libdbus-1-dev pkg-config
          if [[ "${{ matrix.preset }}" == clang-* ]]; then
            sudo apt-get install -y clang libclang-rt-dev clang-tidy clang-tools
          fi

      # Ninja + MSVC: put cl.exe and the Windows SDK on PATH.
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Read pinned Qt version
        run: echo "QT_VERSION=$(tr -d '[:space:]' < qt-version.txt)" >> "$GITHUB_ENV"

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          # Add-on module for Aedst::Media (MediaPlayer, VideoOutput, QVideoSink).
          modules: qtmultimedia
          cache: true

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: .vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-${{ matrix.preset }}-${{ hashFiles('apps/desktop/vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ matrix.preset }}-

      - name: Point VCPKG_ROOT at the runner's vcpkg
        run: echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"

      - name: Install gcovr
        if: matrix.kind == 'coverage'
        run: pipx install gcovr

      # Warnings are errors in CI (AEDST_WARNINGS_AS_ERRORS); local presets keep them as warnings.
      - name: Configure (vcpkg manifest install runs here)
        run: cmake --preset ${{ matrix.preset }} -DAEDST_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      # Blocking gate with a checked-in baseline: scripts/run-clang-tidy.sh,
      # CLANG_TIDY_BASELINE.md. Uses the clang-debug compile database.
      - name: clang-tidy (blocking)
        if: matrix.preset == 'clang-debug'
        run: bash ./scripts/run-clang-tidy.sh build/clang-debug

      - uses: actions/upload-artifact@v4
        if: always() && matrix.preset == 'clang-debug'
        with:
          name: clang-tidy-log
          path: apps/desktop/clang-tidy.log
          if-no-files-found: warn

      # With the build tree the generated QML modules (design system, app) resolve.
      - name: qmllint (with build tree)
        if: matrix.preset == 'gcc-debug'
        run: bash ./scripts/check-qml-lint.sh
        env:
          BUILD_DIR: build/gcc-debug

      # All labels: unit (GoogleTest), qttest (Qt Test), qmltest (QtQuickTest, offscreen).
      # Sanitizer presets export ASAN_/LSAN_/UBSAN_/TSAN_OPTIONS with suppressions from
      # cmake/sanitizers/ (see CMakePresets.json).
      - name: Test
        if: matrix.kind != 'coverage'
        run: ctest --preset ${{ matrix.preset }}

      - name: Coverage report (runs tests, then gcovr)
        if: matrix.kind == 'coverage'
        run: |
          cmake --build --preset coverage-report | tee coverage.log
          { echo "### Coverage (gcovr, Modules/ + App/)"; echo; echo '```'; grep -E "^(lines|functions|branches):" coverage.log || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: matrix.kind == 'coverage'
        with:
          name: coverage-report
          path: apps/desktop/build/coverage/coverage
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Release packages (+ symbols, + optional signing).
  # ---------------------------------------------------------------------------
  package:
    needs: [lint, test]
    name: package (${{ matrix.preset }})
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { preset: msvc-release, os: windows-latest, cpack: "NSIS;ZIP" }
          - { preset: gcc-release, os: ubuntu-latest, cpack: "DEB;RPM;TGZ" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: ${{ env.CMAKE_VERSION }}

      - name: Install system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libegl1 libfontconfig1 \
            libsecret-1-dev libdbus-1-dev pkg-config rpm

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Read pinned Qt version
        run: echo "QT_VERSION=$(tr -d '[:space:]' < qt-version.txt)" >> "$GITHUB_ENV"

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          # Add-on module for Aedst::Media (MediaPlayer, VideoOutput, QVideoSink).
          modules: qtmultimedia
          cache: true

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: .vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-${{ matrix.preset }}-${{ hashFiles('apps/desktop/vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ matrix.preset }}-

      - name: Point VCPKG_ROOT at the runner's vcpkg
        run: echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"

      # Secrets cannot be used in `if:`; map them into env here and derive one flag.
      # On fork PRs the secrets are empty, so the flag stays unset and packages are unsigned.
      - name: Detect signing secrets
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          has=false
          case "$RUNNER_OS" in
            Windows)
              if [ -n "$WINDOWS_CERT_PFX_BASE64" ] && [ -n "$WINDOWS_CERT_PASSWORD" ]; then has=true; fi ;;
            Linux)
              if [ -n "$GPG_PRIVATE_KEY" ]; then has=true; fi ;;
          esac
          echo "HAS_SIGNING_SECRETS=$has" >> "$GITHUB_ENV"
          echo "Signing secrets present for $RUNNER_OS: $has"

      # Telemetry keys are baked into release builds from repository secrets (empty on
      # forks: Sentry and PostHog then stay off at runtime). Neither is a credential
      # for anything but event ingestion, but they stay out of the repo.
      - name: Configure
        run: >-
          cmake --preset ${{ matrix.preset }}
          "-DAEDST_SENTRY_DSN=${AEDST_SENTRY_DSN}"
          "-DAEDST_POSTHOG_KEY=${AEDST_POSTHOG_KEY}"
        env:
          AEDST_SENTRY_DSN: ${{ secrets.AEDST_DESKTOP_SENTRY_DSN }}
          AEDST_POSTHOG_KEY: ${{ secrets.AEDST_DESKTOP_POSTHOG_KEY }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      # Sign the binary BEFORE cpack so the installer embeds the signed exe.
      - name: Sign aedst-desktop.exe (Authenticode)
        if: runner.os == 'Windows' && env.HAS_SIGNING_SECRETS == 'true'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: ./packaging/windows/sign.ps1 -Files build/${{ matrix.preset }}/App/aedst-desktop.exe

      - name: Package (cpack)
        working-directory: apps/desktop/build/${{ matrix.preset }}
        run: cpack -G "${{ matrix.cpack }}"

      - name: Sign the Windows installer
        if: runner.os == 'Windows' && env.HAS_SIGNING_SECRETS == 'true'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $installers = Get-ChildItem build/${{ matrix.preset }}/packages -Filter *.exe | ForEach-Object { $_.FullName }
          ./packaging/windows/sign.ps1 -Files $installers

      # Detached GPG signatures next to the .deb/.rpm/.tar.gz (verify: gpg --verify x.asc x).
      - name: Sign Linux packages (detached GPG)
        if: runner.os == 'Linux' && env.HAS_SIGNING_SECRETS == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          shopt -s nullglob
          for f in build/${{ matrix.preset }}/packages/*.deb build/${{ matrix.preset }}/packages/*.rpm build/${{ matrix.preset }}/packages/*.tar.gz; do
            gpg --batch --yes --pinentry-mode loopback --passphrase "${GPG_PASSPHRASE:-}" --armor --detach-sign "$f"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: aedst-desktop-${{ runner.os }}
          path: apps/desktop/build/${{ matrix.preset }}/packages/*
          if-no-files-found: error

      # PDB (Windows), .debug split by build-id (Linux): produced by the
      # aedst_split_debug_symbols target (cmake/AedstBuildOptions.cmake). Keep them: a
      # release crash dump is unreadable without the symbols of THAT build.
      - uses: actions/upload-artifact@v4
        with:
          name: aedst-symbols-${{ runner.os }}
          path: apps/desktop/build/${{ matrix.preset }}/symbols
          if-no-files-found: error
          retention-days: 90

      # Sentry symbolication: upload this build's PDB / .debug so crashpad
      # minidumps resolve to functions and lines. The release name must match
      # SentryConfig.release ("aedst-desktop@<version>", App/src/main.cpp). Skipped
      # when the secrets are absent (forks, template users without Sentry).
      # Secrets cannot be used in `if:` (same pattern as "Detect signing secrets").
      - name: Detect Sentry upload credentials
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_DESKTOP_PROJECT }}
        run: |
          if [ -n "$SENTRY_AUTH_TOKEN" ] && [ -n "$SENTRY_ORG" ] && [ -n "$SENTRY_PROJECT" ]; then
            echo "HAS_SENTRY_UPLOAD=true" >> "$GITHUB_ENV"
          fi

      - name: Upload debug symbols to Sentry
        if: env.HAS_SENTRY_UPLOAD == 'true'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_DESKTOP_PROJECT }}
        run: |
          version=$(sed -nE 's/^[[:space:]]*VERSION[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt | head -1)
          npx --yes @sentry/cli@3.8.0 debug-files upload --include-sources --wait \
            "build/${{ matrix.preset }}/symbols" "build/${{ matrix.preset }}/App"
          npx --yes @sentry/cli@3.8.0 releases new "aedst-desktop@${version}" || true

  # ---------------------------------------------------------------------------
  # Install the produced package on a clean runner (no compiler, no Qt), run it,
  # uninstall it, and check nothing is left behind. main.cpp must implement
  # `aedst-desktop --version` (print AEDST_VERSION, exit 0, no display).
  # ---------------------------------------------------------------------------
  install-verify:
    needs: [package]
    name: install-verify (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Read project version
        run: |
          version=$(sed -nE 's/^[[:space:]]*VERSION[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt | head -1)
          [ -n "$version" ] || { echo "could not read the project version"; exit 1; }
          echo "AEDST_VERSION=$version" >> "$GITHUB_ENV"

      # Same major as the upload-artifact@v4 already used in this repo's workflows.
      - uses: actions/download-artifact@v4
        with:
          name: aedst-desktop-${{ runner.os }}
          path: apps/desktop/verify-pkg

      - name: Verify (Linux .deb)
        if: runner.os == 'Linux'
        run: bash ./scripts/verify-install-linux.sh verify-pkg/*.deb "$AEDST_VERSION"

      - name: Verify (Windows NSIS installer)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = (Get-ChildItem verify-pkg -Filter *.exe | Select-Object -First 1).FullName
          ./scripts/verify-install-windows.ps1 -Installer $installer -Version $env:AEDST_VERSION

  # Explicit scope cuts, not wired here:
  # - AppImage / Flatpak: need linuxdeploy / flatpak-builder + KDE runtime and a real icon
  #   (see apps/desktop/App/resources/icons/README.md); `package_appimage` / `package_flatpak`
  #   targets exist for local use.
  # - MSIX: `package_msix` / `sign_msix` targets exist; not built in CI.
  # - Publishing (GitHub Release / update feed upload): packages are artifacts only.
