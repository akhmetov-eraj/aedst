name: ai-review-desktop

# Thin caller of the reusable ai-review.yml. Prompt: docs/agent/review/desktop.md.

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "docs/agent/review/desktop.md"
      - ".github/workflows/ai-review.yml"
      - ".github/workflows/ai-review-desktop.yml"

permissions:
  contents: read
  pull-requests: write
  issues: read

concurrency:
  group: ai-review-desktop-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    uses: ./.github/workflows/ai-review.yml
    with:
      app_path: apps/desktop
      prompt_file: docs/agent/review/desktop.md
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
