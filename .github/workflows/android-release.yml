name: android-release

# Builds the signed prod release App Bundle for a tagged release and
# attaches it to the GitHub Release — nothing more. AGENTS.md is explicit
# that release signing and Play Store publication stay a human action
# ("Do not merge to main, do not touch release signing or Play
# publication; a human does that"), so this workflow stops at "here is the artifact,"
# never at "and now it's live."
on:
  push:
    tags:
      - "android-v*"
  workflow_dispatch:

defaults:
  run:
    working-directory: apps/android

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-attach:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0

      - name: Generate ConnectRPC/Protobuf client stubs
        run: make generate

      # The google-services plugin is applied only when the file exists; the placeholder keeps the build offline
      # from Firebase. Replace it with the real file (secret) when FCM must work in the shipped bundle.
      - name: Copy placeholder google-services.json
        run: cp app/google-services.json.example app/google-services.json

      # Optional: signing is rule 6's exception, not the default — a repo
      # with no keystore secrets configured still gets a real (unsigned)
      # bundle out of this job, matching how :app:assembleProdRelease
      # already builds without a keystore.properties present locally.
      #
      # A two-step check-then-write, not `if: secrets.X != ''` directly on
      # the write step: the `secrets` context isn't available in a step's
      # `if:` at all (only in `env:`/`with:`, confirmed via actionlint) —
      # and the original `if: env.ANDROID_KEYSTORE_BASE64 != ''` was equally
      # broken the other way, since a step's own `env:` block isn't visible
      # to that same step's `if:`. Either version silently never ran the
      # write step even with the secret configured, leaving every release
      # permanently unsigned (architect-reviewer's Phase 9 self-review
      # finding). Routing the secret through `env:` into `$GITHUB_OUTPUT`
      # first, then reading that output in the next step's `if:`, is the
      # documented way around both problems.
      - name: Check for release keystore
        id: keystore-check
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: echo "has-keystore=$HAS_KEYSTORE" >> "$GITHUB_OUTPUT"

      - name: Write release keystore
        if: steps.keystore-check.outputs.has-keystore == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
          # AndroidApplicationConventionPlugin reads signingConfigs.release from these variables.
          {
            echo "AEDST_KEYSTORE_FILE=release.keystore"
            echo "AEDST_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "AEDST_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "AEDST_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      # Release builds refuse to assemble without TLS pins (core/network verifyReleaseCertPins): the secret
      # AEDST_CERT_PINS holds "sha256/<live>,sha256/<backup>". versionCode comes from GITHUB_RUN_NUMBER
      # (override with the repository variable AEDST_VERSION_CODE).
      - name: Bundle release (app and app-tv)
        env:
          AEDST_CERT_PINS: ${{ secrets.AEDST_CERT_PINS }}
          AEDST_VERSION_CODE: ${{ vars.AEDST_VERSION_CODE }}
        run: ./gradlew :app:bundleRelease :app-tv:bundleRelease "-Paedst.certPins=$AEDST_CERT_PINS"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-release-aab
          path: |
            apps/android/app/build/outputs/bundle/release/*.aab
            apps/android/app-tv/build/outputs/bundle/release/*.aab
          retention-days: 90

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            apps/android/app/build/outputs/bundle/release/*.aab
            apps/android/app-tv/build/outputs/bundle/release/*.aab
          generate_release_notes: true
