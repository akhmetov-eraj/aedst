name: android-release

# Builds the signed prod release App Bundle for a tagged release and
# attaches it to the GitHub Release — nothing more. AGENTS.md is explicit
# that release signing and Play Store publication stay a human action
# ("Не мержи в main, не трогай подпись релиза и Play-публикацию — это
# делает человек"), so this workflow stops at "here is the artifact,"
# never at "and now it's live."
on:
  push:
    tags:
      - "android-v*"
  workflow_dispatch:

defaults:
  run:
    working-directory: apps/android

permissions:
  contents: write

jobs:
  build-and-attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # Optional: signing is rule 6's exception, not the default — a repo
      # with no keystore secrets configured still gets a real (unsigned)
      # bundle out of this job, matching how :app:assembleProdRelease
      # already builds without a keystore.properties present locally.
      #
      # A two-step check-then-write, not `if: secrets.X != ''` directly on
      # the write step: the `secrets` context isn't available in a step's
      # `if:` at all (only in `env:`/`with:`, confirmed via actionlint) —
      # and the original `if: env.ANDROID_KEYSTORE_BASE64 != ''` was equally
      # broken the other way, since a step's own `env:` block isn't visible
      # to that same step's `if:`. Either version silently never ran the
      # write step even with the secret configured, leaving every release
      # permanently unsigned (architect-reviewer's Phase 9 self-review
      # finding). Routing the secret through `env:` into `$GITHUB_OUTPUT`
      # first, then reading that output in the next step's `if:`, is the
      # documented way around both problems.
      - name: Check for release keystore
        id: keystore-check
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: echo "has-keystore=$HAS_KEYSTORE" >> "$GITHUB_OUTPUT"

      - name: Write release keystore
        if: steps.keystore-check.outputs.has-keystore == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - run: ./gradlew :app:bundleProdRelease --configuration-cache

      - uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: apps/android/app/build/outputs/bundle/prodRelease/*.aab
          retention-days: 90

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/android/app/build/outputs/bundle/prodRelease/*.aab
          generate_release_notes: true
