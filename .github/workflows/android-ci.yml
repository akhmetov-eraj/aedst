name: android-ci

on:
  push:
    branches: [main]
    paths: ["apps/android/**", ".github/workflows/android-ci.yml"]
  pull_request:
    paths: ["apps/android/**", ".github/workflows/android-ci.yml"]

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/android

env:
  JAVA_VERSION: "21"

# Every job runs `make generate` (buf generate against apps/server/api/proto,
# see ../../apps/android/buf.gen.yaml and Makefile) before Gradle, mirroring
# apps/web's web-ci.yml `pnpm connect:generate` step. Unlike apps/web, Android
# never commits the generated ConnectRPC/Protobuf Kotlin stubs (core/network's
# src/main/kotlin-gen is gitignored), so there is nothing to `git diff
# --exit-code` against — the freshness check here is that codegen against the
# current apps/server/api/proto succeeds and everything downstream (ktlint,
# detekt, tests, assembleDebug) still compiles against the freshly generated
# client.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
      - uses: bufbuild/buf-setup-action@v1

      - name: Generate ConnectRPC/Protobuf client stubs
        run: make generate

      - name: ktlint
        run: ./gradlew ktlintCheck

      - name: detekt
        run: ./gradlew detekt

      - name: Feature module boundaries
        run: ./scripts/check-feature-boundaries.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
      - uses: bufbuild/buf-setup-action@v1

      - name: Generate ConnectRPC/Protobuf client stubs
        run: make generate

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
      - uses: bufbuild/buf-setup-action@v1

      - name: Generate ConnectRPC/Protobuf client stubs
        run: make generate

      - name: Copy placeholder google-services.json
        run: cp app/google-services.json.example app/google-services.json

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

  # Instrumented tests (androidTest, Macrobenchmark, Baseline Profile generation) need a
  # device or emulator and are intentionally not wired here — see
  # apps/android/README.md's "Distribution" section for the Internal -> Beta ->
  # Production track note and the Fastlane TODO once a real Play Console
  # account exists.
