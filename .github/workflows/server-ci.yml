name: server-ci

on:
  push:
    branches: [main]
    paths: ["apps/server/**", ".github/workflows/server-ci.yml"]
  pull_request:
    paths: ["apps/server/**", ".github/workflows/server-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/server

env:
  GO_VERSION: "1.27.1"
  # Keep in sync with apps/web's `@bufbuild/buf` devDependency version.
  BUF_VERSION: "1.73.0"
  SQLC_VERSION: "1.31.1"
  TASK_VERSION: "3.53.1"

# Every job below is one Taskfile.yml target — the same `task <name>` a
# contributor runs locally, so there is exactly one place ("what does lint
# actually run?") to look, not a Makefile version and a CI-YAML version that
# can drift apart. The `ci` job is the only required status check: adding a
# new job here never requires touching branch protection settings.
jobs:
  gen-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/server/go.sum
      - run: go install github.com/bufbuild/buf/cmd/buf@v${{ env.BUF_VERSION }}
      - run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v${{ env.SQLC_VERSION }}
      - run: go install mvdan.cc/gofumpt@v0.12.0
      - run: go install github.com/go-task/task/v3/cmd/task@v${{ env.TASK_VERSION }}
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: task gen:check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/server/go.sum
      - run: go install github.com/bufbuild/buf/cmd/buf@v${{ env.BUF_VERSION }}
      - run: go install mvdan.cc/gofumpt@v0.12.0
      - run: go install github.com/go-task/task/v3/cmd/task@v${{ env.TASK_VERSION }}
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      # golangci-lint v2 (the config is `version: "2"`) runs staticcheck,
      # govet, errcheck, depguard, ...; `task lint` adds gofumpt, `go vet`,
      # `sqlc vet` and buf lint/format. The action installs the pinned binary
      # that `task lint` then uses.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: apps/server
          install-only: true
      - run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v${{ env.SQLC_VERSION }}
      - run: task lint

  arch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/server/go.sum
      - run: go install github.com/go-task/task/v3/cmd/task@v${{ env.TASK_VERSION }}
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: task arch

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/server/go.sum
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - run: go install github.com/go-task/task/v3/cmd/task@v${{ env.TASK_VERSION }}
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: task vuln

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/server/go.sum
      - run: go install github.com/go-task/task/v3/cmd/task@v${{ env.TASK_VERSION }}
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: task test:race

  lint-migrations:
    # squawk runs via Docker inside the task (see Taskfile.yml's
    # lint:migrations) — no separate tool install needed, github-hosted
    # runners already have Docker.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/server/go.sum
      - run: go install github.com/go-task/task/v3/cmd/task@v${{ env.TASK_VERSION }}
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: task lint:migrations

  breaking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/server/go.sum
      - run: go install github.com/bufbuild/buf/cmd/buf@v${{ env.BUF_VERSION }}
      - run: go install github.com/go-task/task/v3/cmd/task@v${{ env.TASK_VERSION }}
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - if: github.event_name == 'pull_request'
        run: task breaking

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/server/go.sum
      - run: go install github.com/go-task/task/v3/cmd/task@v${{ env.TASK_VERSION }}
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: task test:integration

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deployments/docker/Dockerfile -t aedst-server:ci .

  # Not part of the `ci` gate's needs: a trend to watch, not a merge blocker
  # — a slow query shouldn't block an unrelated PR the way a correctness
  # regression should. Only runs on push to main / manual dispatch, so PRs
  # aren't waiting on a k6 run every time.
  load:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/server/go.sum
      - run: go install github.com/go-task/task/v3/cmd/task@v${{ env.TASK_VERSION }}
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: docker compose -f deployments/docker/docker-compose.yml up -d --wait postgres valkey
      - run: go install github.com/pressly/goose/v3/cmd/goose@v3.28.0
      - run: task migrate
      - name: start server
        run: |
          set -a; . ./.env.example; set +a
          # The scenario drives every request as one user; the per-user limit
          # exists to stop exactly that, so the limits are off for the load test.
          export AEDST_API_RATE_LIMIT_PER_MINUTE=0 AEDST_AUTH_RATE_LIMIT_PER_MINUTE=0 AEDST_LOGIN_RATE_LIMIT_PER_MINUTE=0
          nohup go run ./cmd/server > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/livez && break
            sleep 1
          done
      - run: task load SCENARIO=smoke
      - run: task load SCENARIO=load RATE=10 DURATION=1m
      - if: always()
        run: docker compose -f deployments/docker/docker-compose.yml down -v

  ci:
    if: always()
    needs:
      [
        gen-check,
        lint,
        arch,
        vuln,
        unit,
        lint-migrations,
        breaking,
        integration,
        docker-build,
      ]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
