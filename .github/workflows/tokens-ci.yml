name: tokens-ci

on:
  push:
    branches: [main]
    paths: ["packages/design-tokens/**", ".github/workflows/tokens-ci.yml"]
  pull_request:
    paths: ["packages/design-tokens/**", ".github/workflows/tokens-ci.yml"]

permissions:
  contents: read

concurrency:
  group: tokens-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "12.6.0"

jobs:
  # Fails when the committed generated outputs drift from the token sources
  # (`pnpm check` in packages/design-tokens). Guarded so it is a no-op until
  # the package exists.
  tokens-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Detect packages/design-tokens
        id: detect
        run: |
          if [ -f packages/design-tokens/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::packages/design-tokens not present yet; skipping."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.detect.outputs.present == 'true'
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        if: steps.detect.outputs.present == 'true'
        working-directory: packages/design-tokens
        run: |
          if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else pnpm install; fi

      - name: Build tokens
        if: steps.detect.outputs.present == 'true'
        working-directory: packages/design-tokens
        run: pnpm build

      - name: Check for drift
        if: steps.detect.outputs.present == 'true'
        working-directory: packages/design-tokens
        run: pnpm check
