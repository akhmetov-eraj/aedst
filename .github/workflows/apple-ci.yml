name: apple-ci

on:
  push:
    branches: [main]
    paths: ["apps/apple/**", "apps/server/api/proto/**", ".github/workflows/apple-ci.yml", ".github/actions/apple-codegen/**"]
  pull_request:
    paths: ["apps/apple/**", "apps/server/api/proto/**", ".github/workflows/apple-ci.yml", ".github/actions/apple-codegen/**"]

permissions:
  contents: read

concurrency:
  group: apple-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/apple

env:
  # Runner + Xcode verified 2026-10-07 against actions/runner-images
  # (images/macos/macos-26-Readme.md: Xcode 26.6 is the default). App Store
  # uploads require the current SDK; Swift 6.1+ is needed for GRDB 7.11's
  # tools-version. swift-perception 2.0.12 (tools 6.4) is held back — see
  # Core/AedstNavigation/Package.swift.
  XCODE_VERSION: "26.6"
  # Latest stable, verified 2026-10-07 via the GitHub releases API.
  SWIFTLINT_VERSION: "0.65.1"
  # Generator versions == runtime floors in Core/AedstNetwork/Package.swift.
  SWIFT_PROTOBUF_VERSION: "1.38.1"
  CONNECT_SWIFT_VERSION: "1.2.3"

jobs:
  # The Connect-Swift client stubs are a *build input*: every feature's
  # Connect*Repository / Connect*RemoteDataSource calls the generated
  # Aedst_*_V1_* types (auth, tasks, notifications, search, media, admin), so
  # nothing that compiles a feature can run before this job. It generates them
  # once from apps/server/api/proto and shares them as an artifact with every
  # downstream job (they are gitignored, never committed).
  generate:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - uses: ./.github/actions/apple-codegen
        with:
          swift-protobuf-version: ${{ env.SWIFT_PROTOBUF_VERSION }}
          connect-swift-version: ${{ env.CONNECT_SWIFT_VERSION }}

      - name: swift build (AedstNetwork, with real generated stubs)
        working-directory: apps/apple/Core/AedstNetwork
        run: swift build

      - uses: actions/upload-artifact@v7
        with:
          name: connect-swift-stubs
          path: apps/apple/Core/AedstNetwork/Sources/AedstNetwork/Generated
          if-no-files-found: error
          retention-days: 3

  lint:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Install SwiftLint (pinned)
        run: |
          curl -sSL -o swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          unzip -o swiftlint.zip -d "$RUNNER_TEMP/swiftlint"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"

      - name: SwiftLint
        run: swiftlint lint --config .swiftlint.yml --strict

      - name: Feature package boundaries
        run: ./scripts/check-feature-boundaries.sh

      # Release-critical resources: a malformed plist / privacy manifest / entitlements
      # file is an App Store rejection (or a crash at launch) found far too late.
      - name: Lint plists, privacy manifests and entitlements
        run: |
          plutil -lint App/iOS/Info.plist App/macOS/Info.plist \
            App/iOS/PrivacyInfo.xcprivacy App/macOS/PrivacyInfo.xcprivacy \
            App/iOS/AEDST.entitlements App/macOS/AEDST.entitlements ExportOptions/*.plist
          plutil -lint App/iOS/Resources/*.lproj/InfoPlist.strings

      - name: Release scripts parse
        run: for script in scripts/*.sh; do bash -n "$script"; done

  test:
    needs: generate
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        package:
          - Core/AedstCore
          - Core/AedstNetwork
          - Core/AedstPersistence
          - Core/AedstDesignSystem
          - Core/AedstNavigation
          - Core/AedstAnalytics
          - Core/AedstMedia
          - Core/AedstTelemetry
          - Features/Auth
          - Features/Tasks
          - Features/Search
          - Features/Notifications
          - Features/Media
          - Features/Admin
          - App/Shared
    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - uses: actions/download-artifact@v8
        with:
          name: connect-swift-stubs
          path: apps/apple/Core/AedstNetwork/Sources/AedstNetwork/Generated

      - uses: actions/cache@v6
        with:
          path: |
            apps/apple/${{ matrix.package }}/.build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-${{ matrix.package }}-${{ hashFiles(format('apps/apple/{0}/Package.resolved', matrix.package), format('apps/apple/{0}/Package.swift', matrix.package)) }}
          restore-keys: |
            spm-${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-${{ matrix.package }}-

      - name: swift test (${{ matrix.package }})
        working-directory: apps/apple/${{ matrix.package }}
        run: swift test --enable-code-coverage

  # The real acceptance test for the app: generate the Xcode workspace with
  # Tuist and BUILD both app targets (Release configuration, no signing), so
  # target wiring, resources (xcstrings, privacy manifests), Info.plist and
  # entitlements are all exercised — not just the SwiftPM packages.
  app-build:
    needs: generate
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: App_iOS
            destination: "generic/platform=iOS Simulator"
          - scheme: App_macOS
            destination: "generic/platform=macOS"
    env:
      # Optional: set these repository secrets/variables to upload dSYMs to
      # Sentry from main. Without them the step is skipped (forks stay green).
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT_APPLE }}
    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - uses: actions/download-artifact@v8
        with:
          name: connect-swift-stubs
          path: apps/apple/Core/AedstNetwork/Sources/AedstNetwork/Generated

      # Tuist is pinned in apps/apple/mise.toml (overrides the repo-root "latest").
      - uses: jdx/mise-action@v5
        with:
          install_args: tuist
          working_directory: apps/apple

      - name: tuist install
        run: tuist install

      - name: tuist generate
        run: tuist generate --no-open

      - name: xcodebuild (${{ matrix.scheme }}, Release, unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace AEDST.xcworkspace \
            -scheme "${{ matrix.scheme }}" \
            -configuration Release \
            -destination "${{ matrix.destination }}" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/xcodebuild-${{ matrix.scheme }}.log"

      - name: Privacy manifest is inside the built app
        run: |
          app=$(find "$RUNNER_TEMP/DerivedData" -path "*Release*" -name "AEDST.app" -type d | head -1)
          echo "built app: $app"
          test -n "$app"
          find "$app" -name PrivacyInfo.xcprivacy | grep -q .

      # Symbol upload path is exercised on main so a broken script is caught
      # before a release needs it (apple-release.yml should call the same script
      # on the archive's dSYMs).
      - name: Upload dSYMs to Sentry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.SENTRY_AUTH_TOKEN != ''
        run: ./scripts/upload-dsyms.sh "$RUNNER_TEMP/DerivedData/Build/Products"

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: xcodebuild-log-${{ matrix.scheme }}
          path: ${{ runner.temp }}/xcodebuild-${{ matrix.scheme }}.log
