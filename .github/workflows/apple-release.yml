name: apple-release

# Manual, gated release of the Apple apps. Nothing here runs on push/PR.
# Setup (one-time): docs/content/apple-release.md. The `apple-release` GitHub
# Environment should require reviewer approval, and holds every secret below.
#
# NOT executed in the authoring environment (Windows, no Xcode): the first real
# run is the acceptance test for signing, export options and notarization.

on:
  workflow_dispatch:
    inputs:
      target:
        description: What to build and ship
        type: choice
        required: true
        options:
          - ios-testflight
          - macos-developer-id
          - macos-app-store

permissions:
  contents: read

concurrency:
  group: apple-release
  cancel-in-progress: false

env:
  XCODE_VERSION: "16.3"

jobs:
  release:
    runs-on: macos-15
    environment: apple-release
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/apple
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - uses: jdx/mise-action@v2
        with:
          install_args: tuist
          working_directory: .

      - uses: ./.github/actions/apple-codegen

      - name: Write the App Store Connect API key (.p8) to a temp file
        run: |
          key_path="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "${{ secrets.ASC_KEY_P8_BASE64 }}" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          echo "ASC_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      # Developer ID signing needs the certificate in a keychain; App Store /
      # TestFlight builds use cloud-managed signing through the API key instead.
      - name: Import the Developer ID certificate into a temporary keychain
        if: inputs.target == 'macos-developer-id'
        env:
          CERT_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: iOS -> TestFlight
        if: inputs.target == 'ios-testflight'
        run: UPLOAD=1 bash scripts/release-ios.sh

      - name: macOS -> notarized Developer ID build
        if: inputs.target == 'macos-developer-id'
        run: DISTRIBUTION=developer-id bash scripts/release-macos.sh

      - name: macOS -> Mac App Store
        if: inputs.target == 'macos-app-store'
        run: DISTRIBUTION=app-store UPLOAD=1 bash scripts/release-macos.sh

      - uses: actions/upload-artifact@v4
        if: inputs.target == 'macos-developer-id' && success()
        with:
          name: AEDST-macos-notarized
          path: apps/apple/build/macos/AEDST-*.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xcarchive-${{ inputs.target }}
          path: |
            apps/apple/build/**/AEDST.xcarchive/dSYMs
            apps/apple/build/**/*.log
          if-no-files-found: ignore

      - name: Remove signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" 2>/dev/null || true
