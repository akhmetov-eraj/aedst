name: apple-release

# Manual, gated release of the Apple apps through fastlane (apps/apple/fastlane/Fastfile).
# Nothing here runs on push/PR. Setup (one-time): docs/content/apple/release.md.
# The `apple-release` GitHub Environment should require reviewer approval and
# holds every secret below.
#
# Secrets (Environment `apple-release`):
#   APPLE_TEAM_ID                  10-character developer team id
#   ASC_KEY_ID, ASC_ISSUER_ID      App Store Connect API key id / issuer id
#   ASC_KEY_CONTENT                base64 of the AuthKey_XXXX.p8 file (`base64 -i AuthKey.p8`)
#   MATCH_PASSWORD                 passphrase that encrypts the match store
#   MATCH_GIT_URL                  private git repo that holds the match certificates
#   MATCH_GIT_BASIC_AUTHORIZATION  base64("user:personal-access-token") for that repo
#                                  (or provide an SSH deploy key instead and use an ssh MATCH_GIT_URL)
# Optional (dSYM upload to Sentry): secret SENTRY_AUTH_TOKEN, variables SENTRY_ORG, SENTRY_PROJECT_APPLE.
# S3-compatible match storage instead of git: variables MATCH_STORAGE_MODE=s3, MATCH_S3_BUCKET,
# MATCH_S3_REGION and secrets MATCH_S3_ACCESS_KEY, MATCH_S3_SECRET_ACCESS_KEY (see fastlane/Matchfile).
#
# Certificates and profiles are created once by an admin (`make signing-sync`);
# CI only reads them (match readonly when CI=true).
#
# NOT executed in the authoring environment (Windows, no Xcode): the first real
# run is the acceptance test for signing, export options and notarization.

on:
  workflow_dispatch:
    inputs:
      target:
        description: What to build and ship
        type: choice
        required: true
        options:
          - ios-testflight
          - ios-app-store
          - macos-developer-id
          - macos-app-store

permissions:
  contents: read

concurrency:
  group: apple-release
  cancel-in-progress: false

env:
  XCODE_VERSION: "26.6"

jobs:
  release:
    runs-on: macos-26
    environment: apple-release
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/apple
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
      # `git` (default) or `s3`; the S3 values are only read when MATCH_STORAGE_MODE=s3 (Matchfile).
      MATCH_STORAGE_MODE: ${{ vars.MATCH_STORAGE_MODE || 'git' }}
      MATCH_S3_BUCKET: ${{ vars.MATCH_S3_BUCKET }}
      MATCH_S3_REGION: ${{ vars.MATCH_S3_REGION }}
      MATCH_S3_ACCESS_KEY: ${{ secrets.MATCH_S3_ACCESS_KEY }}
      MATCH_S3_SECRET_ACCESS_KEY: ${{ secrets.MATCH_S3_SECRET_ACCESS_KEY }}
      # Public per-environment app config (repository/environment VARIABLES, not secrets): read by
      # fastlane build_xcargs and passed to xcodebuild. Empty = xcconfig default (OIDC off).
      AEDST_API_ENVIRONMENT: ${{ vars.AEDST_API_ENVIRONMENT }}
      AEDST_SENTRY_DSN: ${{ vars.AEDST_SENTRY_DSN }}
      AEDST_POSTHOG_KEY: ${{ vars.AEDST_POSTHOG_KEY }}
      AEDST_POSTHOG_HOST: ${{ vars.AEDST_POSTHOG_HOST }}
      AEDST_POSTHOG_SESSION_REPLAY: ${{ vars.AEDST_POSTHOG_SESSION_REPLAY }}
      AEDST_ROLES_CLAIM: ${{ vars.AEDST_ROLES_CLAIM }}
      AEDST_OIDC_ISSUER: ${{ vars.AEDST_OIDC_ISSUER }}
      AEDST_OIDC_CLIENT_ID: ${{ vars.AEDST_OIDC_CLIENT_ID }}
      AEDST_OIDC_SCOPES: ${{ vars.AEDST_OIDC_SCOPES }}
      AEDST_OIDC_AUDIENCE_SCOPE: ${{ vars.AEDST_OIDC_AUDIENCE_SCOPE }}
      AEDST_OIDC_REDIRECT_SCHEME: ${{ vars.AEDST_OIDC_REDIRECT_SCHEME }}
      AEDST_OIDC_REFRESH_TTL_DAYS: ${{ vars.AEDST_OIDC_REFRESH_TTL_DAYS }}
      AEDST_OIDC_WEBCREDENTIALS_DOMAIN: ${{ vars.AEDST_OIDC_WEBCREDENTIALS_DOMAIN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT_APPLE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      # Tuist is pinned in apps/apple/mise.toml.
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: tuist
          working_directory: apps/apple

      # Ruby version == apps/apple/mise.toml; gems from Gemfile.lock (commit it after the first `bundle install`).
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "3.4.11"
          working-directory: apps/apple
          bundler-cache: true

      # The Connect-Swift client stubs are a build input (fastlane then runs `make generate` too;
      # this step installs buf and the protoc plugins it needs).
      - uses: ./.github/actions/apple-codegen

      - name: iOS -> TestFlight
        if: inputs.target == 'ios-testflight'
        run: bundle exec fastlane ios beta

      - name: iOS -> App Store Connect (not submitted for review)
        if: inputs.target == 'ios-app-store'
        run: bundle exec fastlane ios release

      - name: macOS -> notarized Developer ID build
        if: inputs.target == 'macos-developer-id'
        run: bundle exec fastlane mac developer_id

      - name: macOS -> Mac App Store
        if: inputs.target == 'macos-app-store'
        run: bundle exec fastlane mac app_store

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.target == 'macos-developer-id' && success()
        with:
          name: AEDST-macos-notarized
          path: apps/apple/build/macos/AEDST-*.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: xcarchive-${{ inputs.target }}
          path: |
            apps/apple/build/**/AEDST.xcarchive/dSYMs
          if-no-files-found: ignore
