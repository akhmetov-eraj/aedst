name: docs-ci

on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/docs-ci.yml"]
  pull_request:
    paths: ["docs/**", ".github/workflows/docs-ci.yml"]

concurrency:
  group: docs-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: docs

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "12.6.0"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

  build:
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4
        with:
          # nextra reads git history to render each page's "last updated"
          # timestamp; a shallow clone just produces the "Failed to get the
          # last modified timestamp from Git" warning seen locally, not a
          # build failure, but fetch full history so the real site has it.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (includes Pagefind search indexing via postbuild)
        run: pnpm build

      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: |
            docs/.next
            docs/public/_pagefind
          retention-days: 7
