name: docs-ci

on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/docs-ci.yml"]
  pull_request:
    paths: ["docs/**", ".github/workflows/docs-ci.yml"]

permissions:
  contents: read

concurrency:
  group: docs-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: docs

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "12.6.0"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

  build:
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # nextra reads git history to render each page's "last updated"
          # timestamp; a shallow clone just produces the "Failed to get the
          # last modified timestamp from Git" warning seen locally, not a
          # build failure, but fetch full history so the real site has it.
          fetch-depth: 0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # NEXT_PUBLIC_DOCS_URL / NEXT_PUBLIC_DOCS_REPO_BASE / NEXT_PUBLIC_DOCS_LICENSE can be set via repository variables.
      # fetch-depth: 0 above is also required for the sitemap lastModified dates (git log).
      - name: Build (includes Pagefind search indexing via postbuild)
        run: pnpm build

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docs-site
          path: |
            docs/.next
            docs/public/_pagefind
          retention-days: 7
