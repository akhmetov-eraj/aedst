name: Feature request
description: Propose a new capability or an improvement.
title: "[feature] "
labels:
  - enhancement
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - apps/server
        - apps/web
        - apps/android
        - apps/apple
        - apps/desktop
        - Several apps (contract change)
        - docs / CI / tooling
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can a user or developer not do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: Check docs/content/decisions.md first; recorded decisions are not re-proposed.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered, including existing libraries
      description: Library-First applies; name the library or platform API that was ruled out and why.
    validations:
      required: false
