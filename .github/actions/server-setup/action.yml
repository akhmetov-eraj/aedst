name: server-setup
description: >-
  Installs the server toolchain from the repo-root mise.toml (single source of
  tool versions, so CI never repeats a version) and restores the Go caches.
  Run actions/checkout first.

inputs:
  tools:
    description: >-
      Space-separated mise tools to install (a subset of mise.toml; go-backend tools by their full key), for example "go task buf".
    default: "go task"

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      with:
        install_args: ${{ inputs.tools }}
        cache: true

    - name: Go module and build caches
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: go-${{ runner.os }}-${{ hashFiles('apps/server/go.sum') }}
        restore-keys: |
          go-${{ runner.os }}-

    - name: Put GOPATH/bin on PATH
      shell: bash
      run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

