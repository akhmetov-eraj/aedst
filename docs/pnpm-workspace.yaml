  - '@next/swc-darwin-x64@16.4.0'
  - '@next/swc-linux-arm64-gnu@16.4.0'
  - '@next/swc-linux-arm64-musl@16.4.0'
  - '@next/swc-linux-x64-gnu@16.4.0'
  - '@next/swc-linux-x64-musl@16.4.0'
  - '@next/swc-win32-arm64-msvc@16.4.0'
  - '@next/swc-win32-x64-msvc@16.4.0'
  - next@16.4.0
overrides:
  # nextra-theme-docs@4.6.1's <Layout> throws "expected nonoptional, received
  # undefined -> at children" on zod >=4.4.0 (upstream: shuding/nextra#4989,
  # #5008, #5036 — fix landed for #4990 but not yet in a published 4.x
  # release as of this writing). Pin below the regression until a fixed
