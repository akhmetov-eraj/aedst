# Machine-readable parity matrix: feature x platform x status, and behaviour x platform x status.
# Checked by `task check:features` (scripts/check-features.mjs) in CI. Docs: docs/content/parity.md.
#
# Status vocabulary (honest, ordered):
#   verified     built and its tests ran on a real toolchain (only platforms whose `verification` is verified)
#   implemented  code and tests exist but were never compiled/run (platform `verification: static`)
#   missing      not implemented yet; must carry `tracking:` and blocks `--require-complete`
#   na           does not apply to this platform; must carry `reason:`
# `evidence` paths must exist; a feature/behaviour may not claim more than its platform's verification level.
version: 1

platforms:
  server:  { root: apps/server,  verification: verified }
  web:     { root: apps/web,     verification: verified }
  android: { root: apps/android, verification: verified }  # unit tests + assemble + lint + ktlint + detekt run on this machine; device runs (Keystore, AppAuth, Play Integrity, FCM) are not verified
  apple:   { root: apps/apple,   verification: static }
  desktop: { root: apps/desktop, verification: static }

# One directory per feature per platform. A directory that exists under a platform's feature root but is
# not listed here fails the check (no undeclared features), and so does a listed directory that is missing.
feature_roots:
  server:  apps/server/internal/modules
  web:     apps/web/src/modules
  android: apps/android/feature
  apple:   apps/apple/Features
  desktop: apps/desktop/Modules/Features

# Per feature, besides the directory per platform:
#   flagged         hidden until the server enables it (identical on every client; checked against each client's own
#                   capability declaration, see docs/content/decisions/cross-cutting.md)
#   outbox          offline-outbox item types the feature delivers (the union must equal knownTypes of offline-outbox.json)
#   i18n_namespace  the web message namespace (modules/<id>/i18n/<locale>.json top-level key and manifest i18nNamespaces)
#   routes          the web route paths of the module manifest
# The shape every feature must have on every platform is checked by scripts/features/shape.mjs; a deviation is
# declared in `exceptions` below with a reason.
features:
  admin:         { server: admin,         web: admin,         android: admin,         apple: Admin,         desktop: Admin, flagged: true, outbox: [], i18n_namespace: admin, routes: [/admin] }
  auth:          { server: auth,          web: auth,          android: auth,          apple: Auth,          desktop: Auth, flagged: false, outbox: [], i18n_namespace: auth, routes: [/] }
  media:         { server: media,         web: media,         android: media,         apple: Media,         desktop: Media, flagged: false, outbox: [], i18n_namespace: media, routes: [] }
  notifications: { server: notifications, web: notifications, android: notifications, apple: Notifications, desktop: Notifications, flagged: false, outbox: [], i18n_namespace: notifications, routes: [/notifications] }
  search:        { server: search,        web: search,        android: search,        apple: Search,        desktop: Search, flagged: false, outbox: [], i18n_namespace: search, routes: [/search] }
  tasks:         { server: tasks,         web: tasks,         android: tasks,         apple: Tasks,         desktop: Tasks, flagged: false, outbox: [task.create, task.update], i18n_namespace: tasks, routes: [/tasks] }

# Declared deviations from the feature shape. `skip` lists check ids: web manifest|public|ui|lib|i18n|tests|navigation;
# android, apple, desktop data|domain|presentation|navigation|i18n|tests|outbox (+ apple package, desktop pluginId).
# An exception whose check passes is itself an error (stale), so this list cannot rot.
exceptions:
  - { feature: media, platform: android, skip: [data, domain], reason: "Upload scheduling and the repository live in core/media (shared with other features); feature/media is presentation and navigation only." }
  - { feature: tasks, platform: android, skip: [outbox], reason: "GAP, not a design choice: no feature registers an OutboxHandler yet; core/outbox only has the queue, the worker and the replayed fixture. Task writes are not queued offline on Android." }
  - { feature: media, platform: apple, skip: [outbox], reason: "GAP: Apple queues media.complete (finishing an upload) in its outbox; no other client does and offline-outbox.json knownTypes does not list it. Decide whether media.complete joins the shared contract or Apple stops queueing it." }
  - { feature: media, platform: desktop, skip: [data, domain], reason: "The uploader, data source and models live in Modules/Core/Media; Features/Media is presentation and navigation." }

# Server-only modules (device attestation is performed by native clients only).
server_only_modules:
  appattest:
    reason: Apple App Attest verifier; Android/Web/Desktop do not use it.
  integrity:
    reason: Play Integrity verifier; Apple/Web/Desktop do not use it.
  capabilities:
    reason: Server side of capability negotiation; clients consume it through the capability-negotiation behaviour, not a feature module.

# Behaviour parity. `fixtures` are the shared language-neutral scenarios in docs/contract/behavior/
# (validated against a reference model by `task check:behavior`); `evidence` is the platform test that
# replays them or covers the same rule.
behaviors:
  session-refresh:
    fixtures: docs/contract/behavior/session-refresh.json
    platforms:
      server:  { status: na, reason: Resource server verifies tokens only; the IdP refreshes. }
      web:     { status: verified,    evidence: apps/web/src/test/contract/session-refresh.replay.test.ts, note: "Known deviation: first invalid_grant keeps the refresh cookie (multi-replica rotation race window of 15 s); session ends on the next refusal." }
      android: { status: verified,    evidence: apps/android/feature/auth/src/test/kotlin/com/aedst/feature/auth/data/remote/SessionRefreshReplayTest.kt }
      apple:   { status: implemented, evidence: apps/apple/App/Shared/Tests/AedstAppSharedTests/SessionRefreshReplayTests.swift }
      desktop: { status: implemented, evidence: apps/desktop/Modules/Core/Oidc/tests/session_refresh_replay_test.cpp }
  offline-outbox:
    fixtures: docs/contract/behavior/offline-outbox.json
    platforms:
      server:  { status: verified,    evidence: apps/server/internal/platform/idempotency/store_test.go }
      web:     { status: verified,    evidence: apps/web/src/test/contract/offline-outbox.replay.browser.test.ts }
      android: { status: verified,    evidence: apps/android/core/outbox/src/test/kotlin/com/aedst/core/outbox/OfflineOutboxReplayTest.kt }
      apple:   { status: implemented, evidence: apps/apple/Core/AedstPersistence/Tests/AedstPersistenceTests/OfflineOutboxReplayTests.swift }
      desktop: { status: implemented, evidence: apps/desktop/Modules/Core/Outbox/tests/outbox_replay_test.cpp }
  idempotency-key:
    fixtures: docs/contract/behavior/offline-outbox.json
    platforms:
      server:  { status: verified,    evidence: apps/server/internal/platform/idempotency/interceptor_test.go }
      web:     { status: verified,    evidence: apps/web/src/test/contract/offline-outbox.replay.browser.test.ts }
      android: { status: verified,    evidence: apps/android/core/outbox/src/test/kotlin/com/aedst/core/outbox/OutboxSyncWorkerTest.kt }
      apple:   { status: implemented, evidence: apps/apple/Features/Tasks/Sources/Tasks/Data/TaskOutboxHandlers.swift }
      desktop: { status: implemented, evidence: apps/desktop/Modules/Core/Network/tests/client_headers_test.cpp }
  client-identification:
    fixtures: docs/contract/behavior/client-version-gate.json
    platforms:
      server:  { status: verified,    evidence: apps/server/internal/platform/httpserver/clientversion_test.go }
      web:     { status: verified,    evidence: apps/web/src/test/contract/client-version-gate.replay.test.ts, note: "Header is set by the /api/rpc BFF proxy from package.json." }
      android: { status: verified,    evidence: apps/android/core/network/src/test/kotlin/com/aedst/core/network/ClientVersionGateReplayTest.kt }
      apple:   { status: implemented, evidence: apps/apple/Core/AedstNetwork/Tests/AedstNetworkTests/ClientVersionGateReplayTests.swift }
      desktop: { status: implemented, evidence: apps/desktop/Modules/Core/Network/tests/client_version_gate_test.cpp }
  forced-upgrade-ux:
    fixtures: docs/contract/behavior/client-version-gate.json
    platforms:
      server:  { status: verified, evidence: apps/server/internal/platform/httpserver/clientversion_test.go }
      web:     { status: na, reason: Web is always current; a reload fetches the latest build. }
      android: { status: verified, evidence: apps/android/core/network/src/test/kotlin/com/aedst/core/network/ClientUpgradeTest.kt, note: "Phone app only; app-tv does not show the screen yet." }
      apple:   { status: implemented, evidence: apps/apple/App/Shared/Tests/AedstAppSharedTests/UpgradeAndOutboxWiringTests.swift }
      desktop: { status: implemented, evidence: apps/desktop/Modules/Core/Network/tests/client_version_gate_test.cpp }
  capability-negotiation:
    fixtures: docs/contract/behavior/capabilities.json
    platforms:
      server:  { status: verified, evidence: apps/server/internal/modules/capabilities/module/policy_test.go }
      web:     { status: verified, evidence: apps/web/src/test/contract/capabilities.replay.test.ts }
      android: { status: verified, evidence: apps/android/core/capabilities/src/test/kotlin/com/aedst/core/capabilities/CapabilitiesReplayTest.kt, note: "JVM-verified; not run on a device. TV filters nothing (auth only)." }
      apple:   { status: implemented, evidence: apps/apple/Core/AedstNetwork/Tests/AedstNetworkTests/CapabilitiesReplayTests.swift }
      desktop: { status: implemented, evidence: apps/desktop/Modules/Core/Capabilities/tests/capabilities_replay_test.cpp }
  error-kinds:
    fixtures: docs/contract/behavior/error-kinds.json
    platforms:
      server:  { status: na, reason: The server emits Connect codes (internal/platform/httpserver/connecterror.go); the code to kind table is a client concern. }
      web:     { status: verified, evidence: apps/web/src/test/contract/error-kinds.replay.test.ts, note: "Reportable = unknown and storage only; server faults are captured server-side. Web has no local-database source for kind storage." }
      android: { status: verified, evidence: apps/android/core/network/src/test/kotlin/com/aedst/core/network/ErrorKindsReplayTest.kt, note: "JVM-verified. Outbox parks unauthenticated as permanent (no blocked verdict yet)." }
      apple:   { status: implemented, evidence: apps/apple/Core/AedstNetwork/Tests/AedstNetworkTests/ErrorKindsReplayTests.swift, note: "Local cases decoding and unsupported report as unknown. Outbox blocks on upgradeRequired only." }
      desktop: { status: implemented, evidence: apps/desktop/Modules/Core/Network/tests/error_kinds_replay_test.cpp, note: "Also replays the per-kind outbox verdict (Modules/Core/Outbox/tests/outbox_replay_test.cpp). A connection-level failure reports as offline." }
