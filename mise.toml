# mise (https://mise.jdx.dev) toolchain pins. `mise install` gives every
# contributor the same versions CI uses. Taskfile.yml is the entry point for
# commands; mise only provides tools. Keep versions in sync with:
#   go        -> apps/server/go.mod
#   node/pnpm -> .github/workflows/web-ci.yml, docs-ci.yml
#   buf       -> apps/web/package.json (@bufbuild/buf), server-ci.yml
#   task/sqlc -> server-ci.yml
#   gofumpt/govulncheck/goose -> go: backend (built with the pinned go)
[tools]
go = "1.27.1"
node = "24"
pnpm = "12.6.0"
java = "temurin-21"      # Android (AGP 9 / Gradle)
buf = "1.73.0"
task = "3.53.1"
sqlc = "1.31.1"
"go:mvdan.cc/gofumpt" = "0.12.0"                       # == former server-ci go install; tag v0.12.0 verified via git ls-remote
"go:golang.org/x/vuln/cmd/govulncheck" = "1.8.0"        # task vuln; tag v1.8.0 verified via git ls-remote
"go:github.com/pressly/goose/v3/cmd/goose" = "3.28.0"   # task migrate; tag v3.28.0 verified via git ls-remote
golangci-lint = "2.14.0"  # == server-ci.yml; latest stable v2.14.0 verified via GitHub releases 2026-10-08
lefthook = "2.2.0"        # latest stable verified via GitHub releases 2026-10-08
gitleaks = "8.30.1"       # secret scanning (.gitleaks.toml); newest v8 git tag 2026-10-08 (git ls-remote)
opentofu = "1.13.1"      # IaC (decisions.md); latest stable verified via GitHub releases 2026-10-08
cmake = "3.30.5"         # apps/desktop (desktop-ci CMAKE_VERSION)
ninja = "1.13.2"         # latest stable verified via GitHub releases 2026-10-08
# squawk has no mise registry entry; scripts/lint-migrations.sh uses the npm package.
"npm:squawk-cli" = "2.66.0"

# Apple: Tuist is only useful on macOS (Xcode required).
[tools.tuist]
version = "latest"   # UNVERIFIED: could not determine a stable tuist release tag (GitHub releases list only canary/rc tags via API 2026-10-08); pin once verified
os = ["macos"]

# Not managed here (install separately):
#   Qt 6 (apps/desktop/qt-version.txt, via aqtinstall / Qt installer),
#   vcpkg (set VCPKG_ROOT), Xcode 26.6 (macOS), Android SDK, Docker.

[tasks.setup]
description = "Install pinned tools and run the repo-wide setup"
run = "task setup"
