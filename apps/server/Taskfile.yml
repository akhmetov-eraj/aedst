version: "3"

vars:
  MODULES: auth tasks

tasks:
  default:
    cmds:
      - task: check

  # --- local infra -----------------------------------------------------

  up:
    desc: Start Postgres/Redis/NATS for local development.
    cmds:
      - docker compose -f deployments/docker/docker-compose.yml up -d --wait

  down:
    desc: Stop local infra.
    cmds:
      - docker compose -f deployments/docker/docker-compose.yml down

  dev:
    desc: Start local infra, apply migrations, run the server.
    cmds:
      - task: up
      - task: migrate
      - go run ./cmd/server

  run:
    desc: Run the server against already-running infra.
    cmds:
      - go run ./cmd/server

  # --- codegen -----------------------------------------------------------

  gen:
    desc: Regenerate all generated code (proto + sqlc).
    cmds:
      - buf generate
      - sqlc generate
      - gofumpt -l -w gen

  gen:check:
    desc: Fail if generated code is out of date with its sources.
    cmds:
      - task: gen
      - git diff --exit-code -- gen/

  # --- quality gates -------------------------------------------------------

  fmt:
    desc: Format all Go source.
    cmds:
      - gofumpt -l -w .

  lint:
    desc: gofumpt check, vet, golangci-lint, buf lint/format.
    cmds:
      - test -z "$(gofumpt -l .)"
      - go vet ./...
      - golangci-lint run ./...
      - buf lint
      - buf format -d --exit-code

  arch:
    desc: Architecture boundary tests (module/layer isolation).
    cmds:
      - go test ./architecturetest/...

  vuln:
    desc: Dependency vulnerability scan.
    cmds:
      - govulncheck ./...

  # squawk isn't installed as a Go tool (it's a Rust binary) — run via
  # Docker so contributors don't need a second toolchain just to lint SQL.
  # Only the `-- +goose Up` half of each migration is linted: squawk has no
  # notion of goose's `-- +goose Down` marker and would otherwise flag every
  # rollback's DROP TABLE/DROP COLUMN as if it were forward DDL.
  lint:migrations:
    desc: Lint SQL migrations for unsafe changes (squawk).
    vars:
      REPO_ROOT:
        sh: pwd
    cmds:
      - |
        set -eu
        for m in {{.MODULES}}; do
          for f in migrations/$m/*.sql; do
            up_only="${f%.sql}.up-only.sql"
            sed '/-- +goose Down/q' "$f" | sed '$ d' > "$up_only"
            docker run --rm -v "{{.REPO_ROOT}}:/work:ro" -w /work ghcr.io/sbdchd/squawk:latest squawk "${up_only#./}"
            rm -f "$up_only"
          done
        done

  breaking:
    desc: Fail if this branch's proto changes break wire/source compatibility against main.
    cmds:
      - buf breaking --against "../../.git#branch=main,subdir=apps/server"

  # --- tests -----------------------------------------------------------

  test:
    desc: Unit tests only (no external services required).
    cmds:
      - go test ./internal/... ./cmd/...

  test:integration:
    desc: Tests against real Postgres/Redis/NATS via Testcontainers. Requires Docker.
    cmds:
      - go test -tags=integration ./...

  test:load:
    desc: k6 load test against a running server (see test/load). Not part of check/check:full.
    vars:
      SCRIPT: '{{.SCRIPT | default "server_smoke.js"}}'
      REPO_ROOT:
        sh: pwd
    cmds:
      - docker run --rm -v "{{.REPO_ROOT}}/test/load:/scripts:ro" --network host grafana/k6:0.56.0 run "/scripts/{{.SCRIPT}}"

  # --- composite gates -----------------------------------------------------

  check:
    desc: The fast, no-Docker-required gate CI runs on every job (mirrors server-ci.yml).
    cmds:
      - task: gen:check
      - task: lint
      - task: arch
      - task: vuln
      - task: test

  check:full:
    desc: Everything in check, plus Docker-dependent gates.
    cmds:
      - task: check
      - task: lint:migrations
      - task: test:integration

  # --- database ----------------------------------------------------------

  migrate:
    desc: Apply all pending migrations for every module schema.
    vars:
      DB_URL: '{{.DB_URL | default "postgres://aedst:aedst@localhost:5432/aedst?sslmode=disable"}}'
    cmds:
      - |
        set -eu
        for m in {{.MODULES}}; do
          goose -dir migrations/$m postgres "{{.DB_URL}}" up
        done

  migrate:down:
    desc: Roll back the latest migration for every module schema.
    vars:
      DB_URL: '{{.DB_URL | default "postgres://aedst:aedst@localhost:5432/aedst?sslmode=disable"}}'
    cmds:
      - |
        set -eu
        for m in {{.MODULES}}; do
          goose -dir migrations/$m postgres "{{.DB_URL}}" down
        done

  # --- secrets (see deployments/secrets/README.md) ------------------------

  secrets:edit:
    desc: Edit an encrypted secrets file (task secrets:edit ENV=staging).
    cmds:
      - sops deployments/secrets/secrets.{{.ENV}}.enc.yaml

  secrets:view:
    desc: Print an encrypted secrets file's decrypted content (task secrets:view ENV=staging).
    cmds:
      - sops -d deployments/secrets/secrets.{{.ENV}}.enc.yaml

  # --- build ---------------------------------------------------------------

  build:
    desc: Compile the server binary.
    cmds:
      - go build -o bin/aedst-server ./cmd/server

  clean:
    desc: Remove build artifacts.
    cmds:
      - rm -rf bin
