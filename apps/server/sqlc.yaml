version: "2"
sql:
  - schema: migrations/auth
    queries: sql/auth
    engine: postgresql
    gen:
      go:
        package: authdb
        out: gen/db/auth
        sql_package: pgx/v5
        emit_json_tags: true
        emit_interface: true

  - schema: migrations/tasks
    queries: sql/tasks
    engine: postgresql
    gen:
      go:
        package: tasksdb
        out: gen/db/tasks
        sql_package: pgx/v5
        emit_json_tags: true
        emit_interface: true
