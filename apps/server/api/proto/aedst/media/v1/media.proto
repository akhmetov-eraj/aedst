syntax = "proto3";

package aedst.media.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/aedst/server/gen/go/aedst/media/v1;mediav1";

// MediaService manages uploaded files. Bytes never pass through the API
// server: the client asks for a presigned upload URL (S3 / MinIO /
// Cloudflare R2 behind the ObjectStorage interface), PUTs the file directly
// to object storage, then calls CompleteUpload. Completion enqueues a River
// job that verifies the object (size, sniffed content type), extracts
// metadata, sanitizes images (EXIF/GPS stripped, auto-oriented; delivery sizes
// are rendered on demand by imgproxy) and extracts
// video poster frames. When processing finishes the module publishes
// media.v1.MediaReady through the outbox.
//
// Tasks is the reference consumer: a file uploaded with task_id set becomes
// an attachment of that task (the media module checks ownership through the
// tasks module's api/ package).
service MediaService {
  rpc CreateUpload(CreateUploadRequest) returns (CreateUploadResponse);
  rpc CompleteUpload(CompleteUploadRequest) returns (CompleteUploadResponse);
  rpc GetMedia(GetMediaRequest) returns (GetMediaResponse);
  rpc ListMedia(ListMediaRequest) returns (ListMediaResponse);
  rpc DeleteMedia(DeleteMediaRequest) returns (DeleteMediaResponse);
}

enum MediaKind {
  MEDIA_KIND_UNSPECIFIED = 0;
  MEDIA_KIND_IMAGE = 1;
  MEDIA_KIND_VIDEO = 2;
  MEDIA_KIND_AUDIO = 3;
  MEDIA_KIND_DOCUMENT = 4;
}

enum MediaStatus {
  MEDIA_STATUS_UNSPECIFIED = 0;
  // Upload URL issued; object not yet confirmed.
  MEDIA_STATUS_PENDING_UPLOAD = 1;
  MEDIA_STATUS_PROCESSING = 2;
  MEDIA_STATUS_READY = 3;
  MEDIA_STATUS_FAILED = 4;
}

enum VariantKind {
  VARIANT_KIND_UNSPECIFIED = 0;
  // 1-3 were the pre-generated thumbnail/preview/optimized renditions,
  // removed with the govips + imgproxy pipeline (ADR-0015).
  reserved 1, 2, 3;
  reserved "VARIANT_KIND_THUMBNAIL", "VARIANT_KIND_PREVIEW", "VARIANT_KIND_OPTIMIZED";
  // Video poster frame extracted by ffmpeg (stored, presigned URL).
  VARIANT_KIND_POSTER = 4;
  // On-demand imgproxy renditions of an image (or a video poster); the url
  // is a signed imgproxy URL, the format (WebP/AVIF/JPEG) is negotiated from
  // the request Accept header and content_type/size_bytes are empty/0.
  // width/height are the preset target box (card_400: width only, height
  // proportional). Present only when the server has imgproxy enabled.
  VARIANT_KIND_THUMB_64 = 5;
  VARIANT_KIND_AVATAR_256 = 6;
  VARIANT_KIND_CARD_400 = 7;
  VARIANT_KIND_FEED_800X600 = 8;
  VARIANT_KIND_STORY_1080X1350 = 9;
}

message Variant {
  VariantKind kind = 1;
  // Short-lived presigned GET URL.
  string url = 2;
  string content_type = 3;
  int32 width = 4;
  int32 height = 5;
  int64 size_bytes = 6;
}

message Media {
  string id = 1;
  MediaKind kind = 2;
  MediaStatus status = 3;
  string filename = 4;
  string content_type = 5;
  int64 size_bytes = 6;
  int32 width = 7;
  int32 height = 8;
  // Video/audio only.
  int64 duration_ms = 9;
  // Short-lived presigned GET URL of the original; empty until READY.
  string url = 10;
  repeated Variant variants = 11;
  // Set when the file is attached to a task.
  string task_id = 12;
  google.protobuf.Timestamp created_at = 13;
  // Set when status is FAILED.
  string failure_reason = 14;
}

message CreateUploadRequest {
  string filename = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 255
  }];
  string content_type = 2 [(buf.validate.field).string = {
    min_len: 3
    max_len: 127
  }];
  // Server enforces a per-kind maximum (AEDST_MEDIA_MAX_*_BYTES).
  int64 size_bytes = 3 [(buf.validate.field).int64.gt = 0];
  // Optional attachment target.
  string task_id = 4 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
  // Optional hex SHA-256 of the file; when set, object storage verifies it.
  string sha256 = 5 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.len = 64
  ];
}

message CreateUploadResponse {
  Media media = 1;
  string upload_url = 2;
  // HTTP method for upload_url (always "PUT" today).
  string method = 3;
  // Headers the client must send verbatim with the upload request.
  map<string, string> headers = 4;
  google.protobuf.Timestamp expires_at = 5;
}

message CompleteUploadRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message CompleteUploadResponse {
  Media media = 1;
}

message GetMediaRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message GetMediaResponse {
  Media media = 1;
}

message ListMediaRequest {
  // Filter to one task's attachments.
  string task_id = 1 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
  repeated MediaKind kinds = 2 [(buf.validate.field).repeated.items.enum = {
    defined_only: true
    not_in: [0]
  }];
  int32 page_size = 3 [(buf.validate.field).int32 = {
    gte: 0
    lte: 100
  }];
  string page_token = 4 [(buf.validate.field).string.max_len = 512];
}

message ListMediaResponse {
  repeated Media media = 1;
  string next_page_token = 2;
}

message DeleteMediaRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message DeleteMediaResponse {}
