syntax = "proto3";

package aedst.profile.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/aedst/server/gen/go/aedst/profile/v1;profilev1";

// ProfileService is the profile module's public API boundary (see docs/modules.md).
service ProfileService {
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);
}

message Profile {
  string user_id = 1;
  string display_name = 2;
  string bio = 3;
  string avatar_url = 4;
  google.protobuf.Timestamp updated_at = 5;
}

message GetProfileRequest {
  string user_id = 1 [(buf.validate.field).string.uuid = true];
}

message GetProfileResponse {
  Profile profile = 1;
}

message UpdateProfileRequest {
  string user_id = 1 [(buf.validate.field).string.uuid = true];
  string display_name = 2 [(buf.validate.field).string.max_len = 80];
  string bio = 3 [(buf.validate.field).string.max_len = 500];
  string avatar_url = 4 [(buf.validate.field).string.max_len = 2048];
}

message UpdateProfileResponse {
  Profile profile = 1;
}
