syntax = "proto3";

package aedst.auth.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/aedst/server/gen/go/aedst/auth/v1;authv1";

// AuthService is the auth module's public API boundary: it owns credentials
// and sessions, and is the only module that issues or verifies tokens (see
// docs/modules.md and platform/auth). Registration lives in UsersService,
// which calls this module's api/ package in-process to create the
// credential and the initial session.
service AuthService {
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
}

message LoginRequest {
  string email = 1 [(buf.validate.field).string.email = true];
  string password = 2 [(buf.validate.field).string.min_len = 1];
  string device_id = 3 [(buf.validate.field).string.min_len = 1];
}

message LoginResponse {
  string user_id = 1;
  TokenPair tokens = 2;
}

message RefreshTokenRequest {
  string refresh_token = 1 [(buf.validate.field).string.min_len = 1];
}

message RefreshTokenResponse {
  TokenPair tokens = 1;
}

message LogoutRequest {
  string refresh_token = 1 [(buf.validate.field).string.min_len = 1];
}

message LogoutResponse {}

message TokenPair {
  string access_token = 1;
  string refresh_token = 2;
  int64 access_token_expires_in_seconds = 3;
  int64 refresh_token_expires_in_seconds = 4;
}
