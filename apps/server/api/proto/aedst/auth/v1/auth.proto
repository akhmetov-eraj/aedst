syntax = "proto3";

package aedst.auth.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/aedst/server/gen/go/aedst/auth/v1;authv1";

// AuthService is the auth module's public API boundary (see docs/modules.md
// and docs/decisions/0006-module-boundaries.md): it owns credentials,
// sessions, and the core identity record, and is the only module that
// issues or verifies tokens. Registration used to live in a separate
// UsersService that called into auth in-process; that module was removed
// (see docs/decisions/0007-merge-users-into-auth.md) once nothing else in
// the product needed a standalone user directory — auth now owns identity
// end to end.
service AuthService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  // GetCurrentUser derives identity from the authenticated request's bearer
  // token (internal/platform/httpserver's AuthInterceptor) — the request
  // carries no user id. A client-supplied id here would be exactly the kind
  // of IDOR bug modules/tasks' ownership check exists to avoid; this RPC
  // never takes one to begin with.
  rpc GetCurrentUser(GetCurrentUserRequest) returns (GetCurrentUserResponse);
}

message User {
  string id = 1;
  string email = 2;
  google.protobuf.Timestamp created_at = 3;
}

message RegisterRequest {
  string email = 1 [(buf.validate.field).string.email = true];
  string password = 2 [(buf.validate.field).string.min_len = 8];
  string device_id = 3 [(buf.validate.field).string.min_len = 1];
}

message RegisterResponse {
  User user = 1;
  TokenPair tokens = 2;
}

message LoginRequest {
  string email = 1 [(buf.validate.field).string.email = true];
  string password = 2 [(buf.validate.field).string.min_len = 1];
  string device_id = 3 [(buf.validate.field).string.min_len = 1];
}

message LoginResponse {
  string user_id = 1;
  TokenPair tokens = 2;
}

message RefreshTokenRequest {
  string refresh_token = 1 [(buf.validate.field).string.min_len = 1];
}

message RefreshTokenResponse {
  TokenPair tokens = 1;
}

message LogoutRequest {
  string refresh_token = 1 [(buf.validate.field).string.min_len = 1];
}

message LogoutResponse {}

message GetCurrentUserRequest {}

message GetCurrentUserResponse {
  User user = 1;
}

message TokenPair {
  string access_token = 1;
  string refresh_token = 2;
  int64 access_token_expires_in_seconds = 3;
  int64 refresh_token_expires_in_seconds = 4;
}
