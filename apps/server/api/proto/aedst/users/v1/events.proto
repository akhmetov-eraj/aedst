syntax = "proto3";

package aedst.users.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/aedst/server/gen/go/aedst/users/v1;usersv1";

// UserRegistered is published to "aedst.users.user_registered.v1" after a new
// user is committed (see docs/events.md).
message UserRegistered {
  string event_id = 1;
  string user_id = 2;
  string email = 3;
  google.protobuf.Timestamp occurred_at = 4;
}
