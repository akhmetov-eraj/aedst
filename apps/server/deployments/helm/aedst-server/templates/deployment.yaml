apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aedst-server.fullname" . }}
  labels:
    {{- include "aedst-server.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "aedst-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if and .Values.metrics.enabled .Values.metrics.podAnnotations }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.containerPorts.metrics | int64 | quote }}
        prometheus.io/path: /metrics
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "aedst-server.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "aedst-server.serviceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ include "aedst-server.terminationGracePeriodSeconds" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: server
          image: {{ include "aedst-server.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPorts.http }}
              protocol: TCP
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.containerPorts.metrics }}
              protocol: TCP
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "aedst-server.fullname" . }}
          env:
            - name: AEDST_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "aedst-server.secretName" . }}
                  key: {{ required "database.dsnSecretKey is required" .Values.database.dsnSecretKey }}
            {{- if .Values.database.directDsnSecretKey }}
            - name: AEDST_DATABASE_DIRECT_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ include "aedst-server.secretName" . }}
                  key: {{ .Values.database.directDsnSecretKey }}
            {{- end }}
            {{- if and .Values.config.auth.firstPartyEnabled .Values.secretKeys.jwtSigningKey }}
            - name: AEDST_JWT_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "aedst-server.secretName" . }}
                  key: {{ .Values.secretKeys.jwtSigningKey }}
            {{- end }}
            {{- if .Values.secretKeys.jwtPreviousSigningKey }}
            - name: AEDST_JWT_PREVIOUS_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "aedst-server.secretName" . }}
                  key: {{ .Values.secretKeys.jwtPreviousSigningKey }}
            {{- end }}
            {{- if .Values.secretKeys.valkeyPassword }}
            - name: AEDST_VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "aedst-server.secretName" . }}
                  key: {{ .Values.secretKeys.valkeyPassword }}
                  optional: true
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          # /readyz checks dependencies and flips to 503 the moment SIGTERM arrives
          # (graceful drain), so no preStop hook is needed.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- range . }}
        - {{- toYaml . | nindent 10 }}
          labelSelector:
            matchLabels:
              {{- include "aedst-server.selectorLabels" $ | nindent 14 }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
