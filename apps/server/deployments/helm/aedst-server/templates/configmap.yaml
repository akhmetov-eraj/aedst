apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aedst-server.fullname" . }}
  labels:
    {{- include "aedst-server.labels" . | nindent 4 }}
data:
  AEDST_ENV: {{ .Values.config.env | quote }}
  AEDST_SERVICE_NAME: {{ .Values.config.serviceName | quote }}
  AEDST_LOG_LEVEL: {{ .Values.config.log.level | quote }}
  AEDST_LOG_FORMAT: {{ .Values.config.log.format | quote }}
  AEDST_HTTP_ADDR: {{ printf ":%d" (int .Values.containerPorts.http) | quote }}
  {{- if .Values.metrics.enabled }}
  AEDST_METRICS_ADDR: {{ printf ":%d" (int .Values.containerPorts.metrics) | quote }}
  {{- end }}
  AEDST_SHUTDOWN_TIMEOUT_SECONDS: {{ .Values.config.shutdownTimeoutSeconds | int64 | quote }}
  AEDST_SHUTDOWN_DRAIN_SECONDS: {{ .Values.config.shutdownDrainSeconds | int64 | quote }}
  AEDST_REQUEST_TIMEOUT_SECONDS: {{ .Values.config.requestTimeoutSeconds | int64 | quote }}
  AEDST_MAX_REQUEST_BYTES: {{ .Values.config.maxRequestBytes | int64 | quote }}
  {{- if .Values.config.corsAllowedOrigins }}
  AEDST_CORS_ALLOWED_ORIGINS: {{ join "," .Values.config.corsAllowedOrigins | quote }}
  {{- end }}
  AEDST_TRUSTED_PROXY_HOPS: {{ .Values.config.trustedProxyHops | int64 | quote }}
  AEDST_AUTH_RATE_LIMIT_PER_MINUTE: {{ .Values.config.authRateLimitPerMinute | int64 | quote }}
  AEDST_LOGIN_RATE_LIMIT_PER_MINUTE: {{ .Values.config.loginRateLimitPerMinute | int64 | quote }}
  {{- if .Values.config.rolePolicy }}
  AEDST_ROLE_POLICY: {{ include "aedst-server.rolePolicy" . | quote }}
  {{- end }}
  AEDST_API_RATE_LIMIT_PER_MINUTE: {{ .Values.config.apiRateLimitPerMinute | int64 | quote }}
  AEDST_MAX_IN_FLIGHT: {{ .Values.config.maxInFlight | int64 | quote }}
  AEDST_GRPC_REFLECTION_ENABLED: {{ .Values.config.grpcReflectionEnabled | quote }}
  # Retention of append-only tables.
  AEDST_RETENTION_INTERVAL_MINUTES: {{ .Values.config.retention.intervalMinutes | int64 | quote }}
  AEDST_RETENTION_IDEMPOTENCY_HOURS: {{ .Values.config.retention.idempotencyHours | int64 | quote }}
  AEDST_RETENTION_TOMBSTONE_HOURS: {{ .Values.config.retention.tombstoneHours | int64 | quote }}
  AEDST_RETENTION_SESSION_HOURS: {{ .Values.config.retention.sessionHours | int64 | quote }}
  # Database (DSNs are secrets, see the Deployment).
  AEDST_DATABASE_MAX_CONNS: {{ .Values.database.maxConns | int64 | quote }}
  AEDST_DATABASE_MIN_CONNS: {{ .Values.database.minConns | int64 | quote }}
  AEDST_DATABASE_JOBS_MAX_CONNS: {{ .Values.database.jobsMaxConns | int64 | quote }}
  {{- if .Values.database.readDsnSecretKey }}
  AEDST_DATABASE_READ_MAX_CONNS: {{ .Values.database.readMaxConns | int64 | quote }}
  {{- end }}
  AEDST_DATABASE_POOLER: {{ .Values.database.pooler | default "none" | quote }}
  AEDST_JOBS_POLL_ONLY: {{ .Values.database.jobsPollOnly | default false | quote }}
  AEDST_DATABASE_MAX_CONN_LIFETIME_MINUTES: {{ .Values.database.maxConnLifetimeMinutes | int64 | quote }}
  AEDST_DATABASE_MAX_CONN_IDLE_MINUTES: {{ .Values.database.maxConnIdleMinutes | int64 | quote }}
  AEDST_DATABASE_STATEMENT_TIMEOUT_MS: {{ .Values.database.statementTimeoutMs | int64 | quote }}
  AEDST_DATABASE_IDLE_IN_TX_TIMEOUT_MS: {{ .Values.database.idleInTxTimeoutMs | int64 | quote }}
  {{- if .Values.imgproxy.enabled }}
  # imgproxy delivery URLs (key and salt come from the Secret, see the Deployment).
  AEDST_IMGPROXY_ENABLED: "true"
  AEDST_IMGPROXY_URL: {{ required "imgproxy.publicUrl is required" .Values.imgproxy.publicUrl | quote }}
  AEDST_IMGPROXY_URL_TTL_SECONDS: {{ .Values.imgproxy.urlTtlSeconds | int64 | quote }}
  {{- end }}
  # River job retention (integration events are River jobs, ADR-0014).
  AEDST_JOBS_COMPLETED_RETENTION_HOURS: {{ .Values.config.jobsRetention.completedHours | int64 | quote }}
  AEDST_JOBS_CANCELLED_RETENTION_HOURS: {{ .Values.config.jobsRetention.cancelledHours | int64 | quote }}
  AEDST_JOBS_DISCARDED_RETENTION_HOURS: {{ .Values.config.jobsRetention.discardedHours | int64 | quote }}
  {{- if .Values.config.minClientVersions }}
  AEDST_MIN_CLIENT_VERSIONS: {{ .Values.config.minClientVersions | quote }}
  {{- end }}
  {{- if .Values.config.recommendedClientVersions }}
  AEDST_RECOMMENDED_CLIENT_VERSIONS: {{ .Values.config.recommendedClientVersions | quote }}
  {{- end }}
  {{- if .Values.config.features }}
  # Operator feature flags returned by CapabilitiesService/GetCapabilities.
  AEDST_FEATURES: {{ .Values.config.features | toJson | quote }}
  {{- end }}
  # Valkey (password is a secret).
  AEDST_VALKEY_ADDR: {{ .Values.config.valkey.addr | quote }}
  AEDST_VALKEY_DB: {{ .Values.config.valkey.db | int64 | quote }}
  # Auth.
  AEDST_AUTH_FIRST_PARTY_ENABLED: {{ .Values.config.auth.firstPartyEnabled | quote }}
  {{- if .Values.config.auth.firstPartySunset }}
  AEDST_AUTH_FIRST_PARTY_SUNSET: {{ .Values.config.auth.firstPartySunset | quote }}
  {{- end }}
  AEDST_ACCESS_TOKEN_TTL_MINUTES: {{ .Values.config.auth.accessTokenTtlMinutes | int64 | quote }}
  AEDST_REFRESH_TOKEN_TTL_HOURS: {{ .Values.config.auth.refreshTokenTtlHours | int64 | quote }}
  {{- if .Values.config.oidc.issuer }}
  AEDST_OIDC_ISSUER: {{ .Values.config.oidc.issuer | quote }}
  AEDST_OIDC_AUDIENCE: {{ .Values.config.oidc.audience | quote }}
  {{- if .Values.config.oidc.jwksUrl }}
  AEDST_OIDC_JWKS_URL: {{ .Values.config.oidc.jwksUrl | quote }}
  {{- end }}
  AEDST_OIDC_ALGORITHMS: {{ join "," .Values.config.oidc.algorithms | quote }}
  AEDST_OIDC_TOKEN_TYPES: {{ join "," .Values.config.oidc.tokenTypes | quote }}
  AEDST_OIDC_ROLES_CLAIM: {{ .Values.config.oidc.rolesClaim | quote }}
  {{- if .Values.config.oidc.rolesOrg }}
  AEDST_OIDC_ROLES_ORG: {{ .Values.config.oidc.rolesOrg | quote }}
  {{- end }}
  AEDST_OIDC_CLOCK_SKEW_SECONDS: {{ .Values.config.oidc.clockSkewSeconds | int64 | quote }}
  {{- end }}
  {{- if .Values.config.otel.endpoint }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.config.otel.endpoint | quote }}
  {{- end }}
  # HTTP listener bounds.
  AEDST_HTTP_READ_HEADER_TIMEOUT_SECONDS: {{ .Values.config.http.readHeaderTimeoutSeconds | int64 | quote }}
  AEDST_HTTP_READ_TIMEOUT_SECONDS: {{ .Values.config.http.readTimeoutSeconds | int64 | quote }}
  AEDST_HTTP_WRITE_TIMEOUT_SECONDS: {{ .Values.config.http.writeTimeoutSeconds | int64 | quote }}
  AEDST_HTTP_IDLE_TIMEOUT_SECONDS: {{ .Values.config.http.idleTimeoutSeconds | int64 | quote }}
  AEDST_HTTP_MAX_HEADER_BYTES: {{ .Values.config.http.maxHeaderBytes | int64 | quote }}
  AEDST_HSTS_MAX_AGE_SECONDS: {{ .Values.config.http.hstsMaxAgeSeconds | int64 | quote }}
  AEDST_REQUIRE_CONNECT_PROTOCOL_HEADER: {{ .Values.config.http.requireConnectProtocolHeader | quote }}
  {{- if .Values.config.http.tlsCertFile }}
  # In-process TLS (the default deployment terminates TLS at the ingress). Mount the files with extraVolumes.
  AEDST_TLS_CERT_FILE: {{ .Values.config.http.tlsCertFile | quote }}
  AEDST_TLS_KEY_FILE: {{ required "config.http.tlsKeyFile is required with tlsCertFile" .Values.config.http.tlsKeyFile | quote }}
  {{- end }}
  # Which River queues this process works (empty = insert-only). Worker
  # Deployments (values: workers) override it per group.
  AEDST_JOBS_QUEUES: {{ .Values.jobs.queues | quote }}
  AEDST_RETENTION_NOTIFICATION_DAYS: {{ .Values.config.retention.notificationDays | int64 | quote }}
  AEDST_RETENTION_AUDIT_DAYS: {{ .Values.config.retention.auditDays | int64 | quote }}
  AEDST_TASKS_DUE_SOON_LEAD_MINUTES: {{ .Values.config.tasks.dueSoonLeadMinutes | int64 | quote }}
  {{- if .Values.config.otel.tracesEndpoint }}
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: {{ .Values.config.otel.tracesEndpoint | quote }}
  {{- end }}
  # Object storage (credentials are secrets, see the Deployment). Empty bucket
  # disables media uploads.
  {{- with .Values.config.storage }}
  AEDST_STORAGE_PROVIDER: {{ .provider | quote }}
  AEDST_STORAGE_BUCKET: {{ .bucket | quote }}
  AEDST_STORAGE_ENDPOINT: {{ .endpoint | quote }}
  AEDST_STORAGE_PUBLIC_ENDPOINT: {{ .publicEndpoint | quote }}
  AEDST_STORAGE_REGION: {{ .region | quote }}
  AEDST_STORAGE_PATH_STYLE: {{ .pathStyle | quote }}
  AEDST_STORAGE_UPLOAD_URL_TTL_SECONDS: {{ .uploadUrlTtlSeconds | int64 | quote }}
  AEDST_STORAGE_DOWNLOAD_URL_TTL_SECONDS: {{ .downloadUrlTtlSeconds | int64 | quote }}
  {{- end }}
  # Push providers (private keys and credentials JSON are secrets).
  {{- with .Values.config.push }}
  AEDST_PUSH_TIMEOUT_SECONDS: {{ .timeoutSeconds | int64 | quote }}
  AEDST_PUSH_VAPID_PUBLIC_KEY: {{ .vapidPublicKey | quote }}
  AEDST_PUSH_VAPID_SUBJECT: {{ .vapidSubject | quote }}
  AEDST_PUSH_FCM_PROJECT_ID: {{ .fcmProjectId | quote }}
  AEDST_PUSH_FCM_CREDENTIALS_FILE: {{ .fcmCredentialsFile | quote }}
  AEDST_PUSH_APNS_KEY_ID: {{ .apnsKeyId | quote }}
  AEDST_PUSH_APNS_TEAM_ID: {{ .apnsTeamId | quote }}
  AEDST_PUSH_APNS_TOPIC: {{ .apnsTopic | quote }}
  AEDST_PUSH_APNS_PRIVATE_KEY_FILE: {{ .apnsPrivateKeyFile | quote }}
  {{- end }}
  # Media processing limits.
  {{- with .Values.config.media }}
  AEDST_MEDIA_MAX_IMAGE_BYTES: {{ .maxImageBytes | int64 | quote }}
  AEDST_MEDIA_MAX_VIDEO_BYTES: {{ .maxVideoBytes | int64 | quote }}
  AEDST_MEDIA_MAX_AUDIO_BYTES: {{ .maxAudioBytes | int64 | quote }}
  AEDST_MEDIA_MAX_DOCUMENT_BYTES: {{ .maxDocumentBytes | int64 | quote }}
  AEDST_MEDIA_MAX_IMAGE_PIXELS: {{ .maxImagePixels | int64 | quote }}
  AEDST_MEDIA_FFMPEG_PATH: {{ .ffmpegPath | quote }}
  AEDST_MEDIA_FFPROBE_PATH: {{ .ffprobePath | quote }}
  AEDST_MEDIA_PROCESS_TIMEOUT_SECONDS: {{ .processTimeoutSeconds | int64 | quote }}
  AEDST_MEDIA_PENDING_UPLOAD_TTL_HOURS: {{ .pendingUploadTtlHours | int64 | quote }}
  {{- end }}
  # Google Play Integrity (modules/integrity). Off unless enabled.
  {{- with .Values.config.integrity }}
  AEDST_INTEGRITY_ENABLED: {{ .enabled | quote }}
  {{- if .enabled }}
  AEDST_INTEGRITY_ALLOWED_PACKAGES: {{ join "," .allowedPackages | quote }}
  AEDST_INTEGRITY_CREDENTIALS_FILE: {{ .credentialsFile | quote }}
  AEDST_INTEGRITY_MAX_TOKEN_AGE_SECONDS: {{ .maxTokenAgeSeconds | int64 | quote }}
  AEDST_INTEGRITY_MAX_FUTURE_SKEW_SECONDS: {{ .maxFutureSkewSeconds | int64 | quote }}
  AEDST_INTEGRITY_MIN_DEVICE_LEVEL: {{ .minDeviceLevel | quote }}
  AEDST_INTEGRITY_REQUIRE_PLAY_RECOGNIZED: {{ .requirePlayRecognized | quote }}
  AEDST_INTEGRITY_REQUIRE_LICENSED: {{ .requireLicensed | quote }}
  AEDST_INTEGRITY_ALLOW_TESTING_RESPONSES: {{ .allowTestingResponses | quote }}
  AEDST_INTEGRITY_RATE_LIMIT_PER_MINUTE: {{ .rateLimitPerMinute | int64 | quote }}
  AEDST_INTEGRITY_TIMEOUT_SECONDS: {{ .timeoutSeconds | int64 | quote }}
  {{- end }}
  {{- end }}
  # Apple App Attest (modules/appattest). Off unless enabled.
  {{- with .Values.config.appattest }}
  AEDST_APPATTEST_ENABLED: {{ .enabled | quote }}
  {{- if .enabled }}
  AEDST_APPATTEST_TEAM_ID: {{ .teamId | quote }}
  AEDST_APPATTEST_ALLOWED_BUNDLE_IDS: {{ join "," .allowedBundleIds | quote }}
  AEDST_APPATTEST_ALLOW_DEVELOPMENT: {{ .allowDevelopment | quote }}
  AEDST_APPATTEST_RATE_LIMIT_PER_MINUTE: {{ .rateLimitPerMinute | int64 | quote }}
  AEDST_APPATTEST_ASSERTION_RATE_LIMIT_PER_MINUTE: {{ .assertionRateLimitPerMinute | int64 | quote }}
  AEDST_APPATTEST_KEY_RETENTION_DAYS: {{ .keyRetentionDays | int64 | quote }}
  {{- end }}
  {{- end }}
  # Transport security and abuse limits.
  AEDST_VALKEY_TLS: {{ .Values.config.valkey.tls | quote }}
  {{- if .Values.config.valkey.tlsServerName }}
  AEDST_VALKEY_TLS_SERVER_NAME: {{ .Values.config.valkey.tlsServerName | quote }}
  {{- end }}
  {{- if .Values.config.valkey.tlsCaFile }}
  AEDST_VALKEY_TLS_CA_FILE: {{ .Values.config.valkey.tlsCaFile | quote }}
  {{- end }}
  AEDST_VALKEY_ALLOW_PLAINTEXT: {{ .Values.config.valkey.allowPlaintext | quote }}
  AEDST_DATABASE_ALLOW_UNVERIFIED_TLS: {{ .Values.database.allowUnverifiedTls | quote }}
  AEDST_AUTH_FAIL_RATE_LIMIT_PER_MINUTE: {{ .Values.config.authFailRateLimitPerMinute | int64 | quote }}
  {{- if and .Values.config.pprofEnabled .Values.metrics.enabled }}
  AEDST_PPROF_ENABLED: "true"
  {{- end }}
