# Template for deployments/secrets/secrets.<env>.enc.yaml. Copy, fill in, then
# encrypt IN PLACE with the repository's SOPS rules (see README.md):
#
#   cp secrets.example.yaml secrets.staging.enc.yaml
#   $EDITOR secrets.staging.enc.yaml        # real values, one per key
#   sops --encrypt --in-place secrets.staging.enc.yaml
#
# This is the Kubernetes Secret the Helm chart reads (`existingSecret`). The
# metadata is left readable on purpose (.sops.yaml encrypts only data and
# stringData) so Kustomize/ksops can set the namespace. Key names must match
# values.yaml: database.*SecretKey and secretKeys.*.
#
# Required in every deployed environment:
#   database-url         API pool DSN (the PgBouncer/CNPG Pooler when database.pooler is pgbouncer)
#   database-direct-url  direct (non-pooled) DSN: River LISTEN/NOTIFY, advisory locks, migrations
# Required only when the feature is on:
#   jwt-signing-key      config.auth.firstPartyEnabled (>= 32 bytes, not the dev placeholder)
#   valkey-password      when Valkey has a password (the key is optional in the pod)
# Optional (also set the matching secretKeys.* in the values file, otherwise unused):
#   database-read-url, jwt-previous-signing-key, storage-access-key-id,
#   storage-secret-access-key, vapid-private-key, fcm-credentials-json,
#   apns-private-key, integrity-credentials-json
apiVersion: v1
kind: Secret
metadata:
  name: aedst-server-staging # = existingSecret in values-<env>.yaml
type: Opaque
stringData:
  database-url: postgres://aedst:CHANGE-ME@aedst-pg-pooler-rw:5432/aedst?sslmode=verify-full&sslrootcert=/etc/tls/pg/ca.crt
  database-direct-url: postgres://aedst:CHANGE-ME@aedst-pg-rw:5432/aedst?sslmode=verify-full&sslrootcert=/etc/tls/pg/ca.crt
  jwt-signing-key: CHANGE-ME-at-least-32-random-bytes
  valkey-password: CHANGE-ME
  # database-read-url: postgres://aedst:CHANGE-ME@aedst-pg-ro:5432/aedst?sslmode=verify-full&sslrootcert=/etc/tls/pg/ca.crt
  # jwt-previous-signing-key: ""
  # storage-access-key-id: ""
  # storage-secret-access-key: ""
  # vapid-private-key: ""
  # fcm-credentials-json: ""
  # apns-private-key: ""
  # integrity-credentials-json: ""
