# Round-robin balancer for `docker compose --profile loadtest up --scale server=N`.
# Using a variable in proxy_pass makes nginx resolve `server` at request time
# through Docker's embedded DNS (127.0.0.11), so replicas added or restarted
# after nginx started are picked up within `valid`. UNVERIFIED against a live
# compose stack: if requests all land on one replica, check the per-replica
# pool metrics (aedst_db_pool_connections) and switch to Docker's own port
# publishing per replica.
resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 80;

    location / {
        set $upstream http://server:8080;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
    }
}
