# Restore the production database into a NEW cluster from the object store
# (CloudNativePG bootstrap.recovery). NOT part of any kustomization: copy it,
# set the target, apply it in a scratch namespace for a drill, or in the real one
# for a disaster. Procedure, RPO/RTO and drill cadence: docs/content/server/runbook.md
# ("Restore, PITR and failover").
#
# The new cluster must NOT reuse the source's name or serverName: it would start
# archiving WAL into the source's Barman directory. Here it is aedst-pg-restore, and
# its own backup section (below) writes to a separate path until you promote it.
#
# UNVERIFIED: validated against the CloudNativePG CRD schema in CI (kubeconform), never
# restored from a real backup. The first drill is the acceptance test.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: aedst-pg-restore
  namespace: aedst-prod # a scratch namespace for drills
spec:
  instances: 1 # one instance is enough to verify; scale up after promotion
  imageName: ghcr.io/cloudnative-pg/postgresql:18
  storage:
    size: 100Gi
  walStorage:
    size: 20Gi

  bootstrap:
    recovery:
      source: aedst-pg-prod-backup
      # Point in time recovery: replay WAL up to this moment (UTC). Omit recoveryTarget
      # to recover to the end of the archived WAL (latest consistent point).
      recoveryTarget:
        targetTime: "2026-01-01 00:00:00+00" # CHANGE-ME: just before the bad change
        # exclusive: true  # stop right BEFORE targetTime instead of right after

  externalClusters:
    - name: aedst-pg-prod-backup
      barmanObjectStore:
        destinationPath: s3://aedst-pg-backups/prod
        serverName: aedst-pg-prod # the source cluster's serverName (overlays/prod)
        s3Credentials:
          accessKeyId: {name: aedst-pg-backup-prod, key: ACCESS_KEY_ID}
          secretAccessKey: {name: aedst-pg-backup-prod, key: ACCESS_SECRET_KEY}
        wal:
          maxParallel: 8 # faster WAL replay

  # Backups of the restored cluster go to their own path, never the source's.
  backup:
    barmanObjectStore:
      destinationPath: s3://aedst-pg-backups/prod-restored
      serverName: aedst-pg-restore
      s3Credentials:
        accessKeyId: {name: aedst-pg-backup-prod, key: ACCESS_KEY_ID}
        secretAccessKey: {name: aedst-pg-backup-prod, key: ACCESS_SECRET_KEY}
