# Staging: smaller footprint, availability over durability, its own backup
# destination, server name and credentials Secret (never the production ones).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: aedst-pg
spec:
  instances: 2
  postgresql:
    synchronous:
      method: any
      number: 1
      dataDurability: preferred # one replica: do not block writes while it restarts
    parameters:
      max_connections: "150"
      shared_buffers: 256MB
      effective_cache_size: 768MB
  storage:
    size: 20Gi
  walStorage:
    size: 5Gi
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {memory: 1Gi}
  backup:
    retentionPolicy: 7d
    barmanObjectStore:
      destinationPath: s3://aedst-pg-backups/staging # CHECK: your bucket
      serverName: aedst-pg-staging
      s3Credentials:
        accessKeyId: {name: aedst-pg-backup-staging, key: ACCESS_KEY_ID}
        secretAccessKey: {name: aedst-pg-backup-staging, key: ACCESS_SECRET_KEY}
