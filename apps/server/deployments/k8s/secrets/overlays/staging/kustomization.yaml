apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aedst-staging
# ksops decrypts the SOPS file at build time inside the Argo CD repo-server; the
# result is the Secret named by existingSecret in values-staging.yaml. Needs the
# repo-server setup in deployments/secrets/README.md ("Delivering to the cluster").
generators:
  - secret-generator.yaml
