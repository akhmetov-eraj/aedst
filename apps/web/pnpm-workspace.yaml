onlyBuiltDependencies:
  - '@bufbuild/buf'
  - '@parcel/watcher'
  - '@swc/core'
# Explicit (it is also pnpm 12's default): a version must be at least one day
# old before pnpm resolves it. pnpm re-verifies the WHOLE lockfile against this
# window on every install, so a longer window (e.g. 10080 = one week) rejects
# every lockfile entry published inside it; raise it only together with the
# matching exclusions, and re-check with `pnpm install --lockfile-only`.
# The exclusions below are versions already in pnpm-lock.yaml that were younger
# than the window when resolved; drop an entry once its package leaves the lockfile.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@next/env@16.4.0'
  - '@next/swc-darwin-arm64@16.4.0'
  - '@next/swc-darwin-x64@16.4.0'
  - '@next/swc-linux-arm64-gnu@16.4.0'
  - '@next/swc-linux-arm64-musl@16.4.0'
  - '@next/swc-linux-x64-gnu@16.4.0'
  - '@next/swc-linux-x64-musl@16.4.0'
  - '@next/swc-win32-arm64-msvc@16.4.0'
  - '@next/swc-win32-x64-msvc@16.4.0'
  - '@posthog/core@1.57.1'
  - '@sentry/browser-utils@11.5.0'
  - '@sentry/browser@11.5.0'
  - '@sentry/bundler-plugins@11.5.0'
  - '@sentry/core@11.5.0'
  - '@sentry/feedback@11.5.0'
  - '@sentry/nextjs@11.5.0'
  - '@sentry/node@11.5.0'
  - '@sentry/opentelemetry@11.5.0'
  - '@sentry/react@11.5.0'
  - '@sentry/replay-canvas@11.5.0'
  - '@sentry/replay@11.5.0'
  - '@sentry/server-runtime-injection@11.5.0'
  - '@sentry/server-utils@11.5.0'
  - '@sentry/vercel-edge@11.5.0'
  - '@shadcn/registry@0.1.3'
  - knip@6.40.0
  - next@16.4.0
  - posthog-js@1.438.2
  - shadcn@4.21.4
allowBuilds:
  '@bufbuild/buf': true
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  core-js: false
