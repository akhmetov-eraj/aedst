version: v2
# Generates TypeScript client stubs straight from apps/server's proto sources
# (the source of truth lives in apps/server/api/proto; nothing is duplicated
# here). Run via `pnpm connect:generate`. See apps/server/buf.gen.yaml for the
# Go-side equivalent.
managed:
  enabled: true
# protoc-gen-es alone is sufficient: Connect-ES v2's unified codegen has
# protoc-gen-es emit the service descriptor (`GenService`, via
# @bufbuild/protobuf/codegenv2) alongside the message types, so
# `@connectrpc/connect`'s `createClient()` can consume it directly — there is
# no separate protoc-gen-connect-es plugin for the v2 codegen style.
plugins:
  - local: protoc-gen-es
    out: src/shared/api/connect/generated
    opt:
      - target=ts
