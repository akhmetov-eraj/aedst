# XcodeGen project spec — generates AEDST.xcodeproj (gitignored, see
# ../../.gitignore) from this file. Regenerate with `make generate` (or
# `xcodegen generate`) whenever a target/scheme/source path changes; never
# hand-edit the .xcodeproj. See README.md's "Getting started" for the
# one-time `brew install xcodegen` this needs.
#
# One project, two platform-specific app targets (`App_iOS`, `App_macOS`)
# sharing every line of business logic through the local Swift packages
# under Core/ and Features/, composed in App/Shared — see
# docs/architecture-apple.md.
name: AEDST

options:
  bundleIdPrefix: com.aedst.apple
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

configs:
  Debug: debug
  Release: release

packages:
  AedstAppShared:
    path: App/Shared

targets:
  App_iOS:
    type: application
    platform: iOS
    sources:
      - path: App/iOS/Sources
      - path: App/iOS/Assets.xcassets
    info:
      path: App/iOS/Info.plist
    configFiles:
      Debug: Config/iOS-Debug.xcconfig
      Release: Config/iOS-Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aedst.apple.ios
        PRODUCT_NAME: AEDST
    dependencies:
      - package: AedstAppShared

  App_macOS:
    type: application
    platform: macOS
    sources:
      - path: App/macOS/Sources
      - path: App/macOS/Assets.xcassets
    info:
      path: App/macOS/Info.plist
    configFiles:
      Debug: Config/macOS-Debug.xcconfig
      Release: Config/macOS-Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aedst.apple.macos
        PRODUCT_NAME: AEDST
        COMBINE_HIDPI_IMAGES: YES
        CODE_SIGN_ENTITLEMENTS: App/macOS/AEDST.entitlements
    dependencies:
      - package: AedstAppShared

schemes:
  App_iOS:
    build:
      targets:
        App_iOS: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release

  App_macOS:
    build:
      targets:
        App_macOS: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
