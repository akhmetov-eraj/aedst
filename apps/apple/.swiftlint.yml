included:
  - Core
  - Features
  - App

excluded:
  - "**/.build"
  - "**/Generated"
  - "**/.swiftpm"

opt_in_rules:
  - contains_over_filter_count
  - empty_count
  - explicit_init
  - fatal_error_message
  - first_where
  - missing_docs
  - overridden_super_call
  - prefer_self_in_static_references
  - redundant_type_annotation
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - unused_declaration
  - vertical_whitespace_closing_braces

disabled_rules:
  - todo # TODO(codegen) markers are intentional until `make generate` runs

missing_docs:
  severity: warning
  excludes_extensions: true

line_length:
  warning: 140
  error: 200

identifier_name:
  min_length: 2
  excluded:
    - id

type_name:
  min_length: 3
