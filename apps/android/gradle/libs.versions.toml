[versions]
# Version policy: latest STABLE release of everything (never alpha/beta/rc),
# each verified against Maven Central / Google Maven metadata. Re-verify on
# every bump; see docs/content/library-first.md. Last full re-verification: 2026-10-08
# (new on that pass: JUnit 6.1.3, Roborazzi 1.76.0, AppAuth 0.11.1, Navigation 3 1.2.0; detekt is the one pre-release exception, see "static analysis" below).

# --- language / build ---
kotlin = "2.4.20"
# AGP 9 with built-in Kotlin: no `org.jetbrains.kotlin.android` plugin anywhere
# (convention plugins, benchmark). 9.4.1 is the latest stable.
agp = "9.4.1"
# KSP versions independently of Kotlin since 2.3.0; 2.3.12 supports Kotlin 2.4.x
# and AGP 9.
ksp = "2.3.12"

# --- jetpack compose ---
# Compose UI/Foundation/Material3 versions come from the BOM
# (`platform(libs.compose.bom)` in AndroidComposeConventionPlugin) — do not pin
# them individually. The Compose compiler plugin version == `kotlin`.
compose-bom = "2026.09.00"
compose-activity = "1.13.0"
compose-lifecycle = "2.11.0"

# --- coroutines / DI / navigation ---
coroutines = "1.11.0"
# DI: Hilt (Dagger). Hilt >= 2.59 requires AGP 9 (satisfied). See the DI/AGP
# decision in apps/android/README.md.
hilt = "2.60.1"
hilt-androidx = "1.4.0" # androidx.hilt: lifecycle-viewmodel-compose, work, compiler
# Navigation 3: the back stack is app-owned state (a list of serializable NavKeys); see docs/content/android/architecture.md.
navigation3 = "1.2.0"

# --- networking ---
# ConnectRPC/Protobuf generated client (see ../buf.gen.yaml). connect-kotlin
# 0.9.0 is the latest release (verified on Maven Central + GitHub); it links
# okhttp 5.4.0 and is compatible with OkHttp 5.5.0 (same 5.x API). Plan B if
# the library stalls: see apps/android/README.md.
connect-kotlin = "0.9.0"
okhttp = "5.5.0"
kotlinx-serialization = "1.11.0"

# --- persistence ---
room = "2.8.5"
datastore = "1.2.1"
protobuf-plugin = "0.10.0"
# One protobuf runtime version app-wide: core/datastore's local schema and
# core/network's ConnectRPC gencode both link protobuf-javalite/protobuf-kotlin-lite
# at this version — see apps/android/buf.gen.yaml's comment on why they must match.
protobuf-javalite = "4.36.2"

# --- background work ---
workmanager = "2.12.0"

# --- images ---
coil = "3.6.3"

# --- TV ---
tv-material = "1.1.0"

# --- auth ---
# Native OIDC client: Authorization Code + PKCE (S256) in a Custom Tab, never a WebView (RFC 8252).
appauth = "0.11.1"

# --- security ---
# androidx.security:security-crypto is deprecated; secrets are stored with
# Android Keystore + Google Tink AEAD (core/security).
tink-android = "1.23.0"
play-integrity = "1.6.0"

# --- media ---
# Media3 (ExoPlayer + Compose UI + Transformer): one version for every androidx.media3 artifact.
media3 = "1.11.1"

# --- push ---
# Firebase is used ONLY for Cloud Messaging (FCM). Crash reporting is Sentry and product analytics is PostHog
# (the same tools as apps/web), so Crashlytics/Performance/Analytics were removed: one tool per responsibility.
firebase-bom = "34.19.0"
google-services-plugin = "4.5.0"

# --- debug tooling ---
# LeakCanary: debug builds only (debugImplementation, installed by its own content provider). 2.14 is the latest stable
# on Maven Central (3.0 is alpha-only); verified 2026-10-09.
leakcanary = "2.14"

# --- monitoring ---
# Sentry: crash/error reporting + OkHttp tracing (every io.sentry artifact aligned through the BOM).
sentry = "8.59.0"
sentry-gradle-plugin = "6.23.0"
# PostHog: product analytics + feature flags; consent-gated and disabled when the project key is empty.
posthog = "3.72.0"

# --- static analysis ---
# EXCEPTION to the stable-only policy (explicit owner decision, 2026-10-08): detekt 2.0.0-alpha.6 (group dev.detekt,
# alpha-only on Maven Central; embeds Kotlin 2.4.10 so it parses Kotlin 2.4 sources, unlike 1.23.8). Only dev.detekt
# may carry a pre-release. Revisit trigger: dev.detekt 2.0.0 stable -> drop this exception (docs/content/decisions.md).
detekt = "2.0.0-alpha.6"
ktlint-plugin = "14.2.0"
# Compose lint rules for detekt (mrmans0n/compose-rules). 0.6.7 is built against dev.detekt:detekt-core 2.0.0-alpha.6 (its POM), verified on Maven Central 2026-10-08.
compose-rules = "0.6.7"
# Kover (Kotlin coverage); plugin id org.jetbrains.kotlinx.kover, verified on the Gradle plugin portal 2026-10-08.
kover = "0.9.11"

# --- testing ---
# JUnit 6 (Jupiter) is the test framework everywhere: pure JVM modules (`aedst.jvm.library`), Android library modules
# (`aedst.android.library`). The ONLY JUnit 4 left on the JVM test classpath is what Robolectric,
# the Compose test rules and AndroidJUnitRunner drag in themselves (they are JUnit 4 rules/runners with no Jupiter-native
# equivalent): modules with such tests add `junit-vintage-engine` as testRuntimeOnly so Gradle's JUnit Platform runs
# them next to the Jupiter tests. Instrumented tests (androidTest) and the benchmark module are JUnit 4 by Android's
# design. `junit:junit` is therefore not a direct dependency of any module. See library-first.md.
junit-jupiter = "6.1.3"
roborazzi = "1.76.0" # screenshot (golden image) tests on the JVM through Robolectric native graphics
androidx-test-junit = "1.3.0"
mockk = "1.14.11"
turbine = "1.2.1"
espresso = "3.7.0"
androidx-test = "1.7.0" # androidx.test:core + runner (both 1.7.0, verified on Google Maven)
robolectric = "4.17" # JVM Android runtime for Compose/Room/Worker tests — see docs/content/library-first.md

# --- benchmark ---
androidx-benchmark = "1.5.0"
androidx-profileinstaller = "1.4.1"

javax-inject = "1"
androidx-core = "1.19.1"
splashscreen = "1.2.0"
androidx-appcompat = "1.8.0"
desugar-jdk-libs = "2.1.5"

