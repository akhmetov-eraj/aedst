[versions]
# --- language / build ---
# Verified against JetBrains' Kotlin 2.4.20 release blog — current stable as
# of this update; kept in sync with ksp/compose-compiler below.
kotlin = "2.4.20"
# Hilt Gradle plugin >= 2.59 hard-requires AGP >= 9.0.0 (confirmed by actually
# running Gradle against this project). AGP 9 in turn requires dropping the
# explicit `org.jetbrains.kotlin.android` plugin applied throughout
# build-logic/convention (its built-in-Kotlin support conflicts with it —
# confirmed the same way: "The 'org.jetbrains.kotlin.android' plugin is no
# longer required ... since AGP 9.0"). That's a real convention-plugin
# migration, not a version-catalog tweak, so it's out of scope here — see
# `hilt` below for the version pinned to stay on AGP 8.x instead. 8.13.2 is
# the last 8.x release and is verified compatible with Kotlin 2.4.20 and KSP
# 2.3.12 (which requires AGP >= 8.12.0).
agp = "8.13.2"
# KSP dropped its "<kotlin-version>-<ksp-revision>" artifact naming at 2.3.0
# and now versions independently (see google/ksp releases) — 2.3.12 is the
# latest release and explicitly supports AGP >= 8.12.0 (this catalog's `agp`
# above) and Kotlin 2.4.x. Re-check https://github.com/google/ksp/releases
# whenever `kotlin` above is bumped, since KSP releases can lag a new Kotlin
# feature release by a few weeks.
ksp = "2.3.12"

# --- jetpack compose ---
# Since Kotlin 2.0, the Compose compiler plugin version == the `kotlin`
# version above (wired via compose-compiler-gradlePlugin's version.ref =
# "kotlin" in build-logic/convention). This "compose-compiler" key only pins
# the androidx.compose.ui:* library versions — verified against Google's Maven
# metadata: 1.12.1 is the latest stable androidx.compose.ui:ui release, and it
# is what ships in compose-bom 2026.09.00 (the latest stable BOM, used below
# purely as a version-pin reference since this catalog has no platform() BOM
# import — see the "no BOM" note on the compose-ui libraries further down).
compose-compiler = "1.12.1"
compose-bom = "2026.09.00" # explicit versions used below, BOM kept only as a pin reference
compose-material3 = "1.4.0" # latest stable androidx.compose.material3:material3
compose-activity = "1.10.1"
compose-lifecycle = "2.9.1"

# --- coroutines / DI / navigation ---
coroutines = "1.11.0" # latest stable, compatible with Kotlin 2.4.20
# 2.59+ requires AGP 9 for the Hilt Gradle plugin (google/dagger release
# notes: "adds AGP 9 support... AGP 9 is now a requirement"). 2.58 is the
# newest release still compatible with this catalog's AGP 8.13.2 — the
# Dagger team explicitly held AGP 9 support back from 2.58 for this reason.
# Re-check when a future AGP 9 migration lands and bump straight to latest.
hilt = "2.58"
hilt-navigation-compose = "1.2.0"
navigation-compose = "2.10.2" # latest stable, verified against Google's Maven metadata

# --- networking ---
# ConnectRPC/Protobuf generated client (see ../buf.gen.yaml) — the same
# transport pattern apps/web and apps/apple use against apps/server's proto.
# OkHttp stays as connect-kotlin's HTTP engine (com.connectrpc:connect-kotlin-okhttp);
# Retrofit is not used for aedst.*.v1.*Service calls (see docs/content/library-first.md).
connect-kotlin = "0.7.2"
okhttp = "4.12.0"
kotlinx-serialization = "1.8.0"

# --- persistence ---
room = "2.7.0"
datastore = "1.1.2"
protobuf-plugin = "0.9.4"
# One protobuf runtime version app-wide: core/datastore's local schema and
# core/network's ConnectRPC gencode both link protobuf-javalite/protobuf-kotlin-lite
# at this version — see apps/android/buf.gen.yaml's comment on why they must match.
protobuf-javalite = "4.35.0"

# --- background work ---
workmanager = "2.10.0"
hilt-work = "1.2.0"

# --- images ---
coil = "3.0.4"

# --- TV ---
# androidx.tv:tv-material — official Jetpack Compose for TV design-system library
# (transitively pulls in androidx.tv:tv-foundation, which provides the
# TvLazyRow/TvLazyColumn focus-aware scrolling containers wrapped by
# core/ui-tv). Library-first: this is the approved TV UI library, not a
# custom leanback/focus framework — see docs/content/library-first.md.
tv-material = "1.0.0"

# --- security ---
security-crypto = "1.1.0"
play-integrity = "1.4.0"

# --- monitoring ---
firebase-bom = "33.7.0"
google-services-plugin = "4.4.2"
firebase-crashlytics-plugin = "3.0.2"
firebase-perf-plugin = "1.4.2"

# --- static analysis ---
detekt = "1.23.7"
ktlint-plugin = "12.1.2"

# --- testing ---
junit4 = "4.13.2"
androidx-test-junit = "1.2.1"
mockk = "1.13.13"
turbine = "1.2.0"
mockwebserver = "4.12.0"
espresso = "3.6.1"

# --- benchmark ---
androidx-benchmark = "1.3.3"
androidx-profileinstaller = "1.4.1"

javax-inject = "1"
androidx-core = "1.15.0"
androidx-appcompat = "1.7.0"

[libraries]
# classpath dependencies for build-logic convention plugins (Gradle plugin artifacts, not applied here)
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
ksp-gradlePlugin = { module = "com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }
hilt-gradlePlugin = { module = "com.google.dagger:hilt-android-gradle-plugin", version.ref = "hilt" }
detekt-gradlePlugin = { module = "io.gitlab.arturbosch.detekt:detekt-gradle-plugin", version.ref = "detekt" }
ktlint-gradlePlugin = { module = "org.jlleitschuh.gradle:ktlint-gradle", version.ref = "ktlint-plugin" }
compose-compiler-gradlePlugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }

javax-inject = { module = "javax.inject:javax.inject", version.ref = "javax-inject" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompat" }

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-coroutines-play-services = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

# Compose (explicit versions, no androidx.compose:compose-bom platform() import).
# This isn't a documented policy in CONVENTIONS.md / library-first.md — it's
# just how this catalog is wired today. Because there's no BOM enforcing a
# single consistent set, compose-compiler/compose-material3/compose-bom above
# must be bumped together by hand and cross-checked against
# https://developer.android.com/develop/ui/compose/bom/bom-mapping.
compose-ui = { module = "androidx.compose.ui:ui", version.ref = "compose-compiler" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics", version.ref = "compose-compiler" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview", version.ref = "compose-compiler" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "compose-compiler" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4", version.ref = "compose-compiler" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest", version.ref = "compose-compiler" }
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "compose-material3" }
compose-activity = { module = "androidx.activity:activity-compose", version.ref = "compose-activity" }
compose-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "compose-lifecycle" }
compose-lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "compose-lifecycle" }

navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation-compose" }

hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hilt-navigation-compose" }
hilt-work = { module = "androidx.hilt:hilt-work", version.ref = "hilt-work" }
hilt-work-compiler = { module = "androidx.hilt:hilt-compiler", version.ref = "hilt-work" }

connect-kotlin-core = { module = "com.connectrpc:connect-kotlin", version.ref = "connect-kotlin" }
connect-kotlin-okhttp = { module = "com.connectrpc:connect-kotlin-okhttp", version.ref = "connect-kotlin" }
connect-kotlin-google-javalite-ext = { module = "com.connectrpc:connect-kotlin-google-javalite-ext", version.ref = "connect-kotlin" }
okhttp-core = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging-interceptor = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "mockwebserver" }

room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

datastore-core = { module = "androidx.datastore:datastore", version.ref = "datastore" }
protobuf-javalite = { module = "com.google.protobuf:protobuf-javalite", version.ref = "protobuf-javalite" }
protobuf-kotlin-lite = { module = "com.google.protobuf:protobuf-kotlin-lite", version.ref = "protobuf-javalite" }

workmanager-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "workmanager" }

coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }

tv-material = { module = "androidx.tv:tv-material", version.ref = "tv-material" }

security-crypto = { module = "androidx.security:security-crypto", version.ref = "security-crypto" }
play-integrity = { module = "com.google.android.play:integrity", version.ref = "play-integrity" }

firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebase-bom" }
firebase-crashlytics = { module = "com.google.firebase:firebase-crashlytics" }
firebase-perf = { module = "com.google.firebase:firebase-perf" }
firebase-analytics = { module = "com.google.firebase:firebase-analytics" }

junit4 = { module = "junit:junit", version.ref = "junit4" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }
androidx-test-espresso = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
mockk-android = { module = "io.mockk:mockk-android", version.ref = "mockk" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }

androidx-benchmark-macro = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "androidx-benchmark" }
androidx-profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "androidx-profileinstaller" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-plugin" }
google-services = { id = "com.google.gms.google-services", version.ref = "google-services-plugin" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "firebase-crashlytics-plugin" }
firebase-perf = { id = "com.google.firebase.firebase-perf", version.ref = "firebase-perf-plugin" }
protobuf = { id = "com.google.protobuf", version.ref = "protobuf-plugin" }
androidx-benchmark = { id = "androidx.benchmark", version.ref = "androidx-benchmark" }
