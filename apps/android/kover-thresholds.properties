# Per-module minimum JVM line coverage in percent, enforced by `./gradlew koverVerifyDebug` (android-ci, test job).
# Read by build-logic/convention/.../KoverConvention.kt. Keys are module directories (a ':' would be a Properties
# separator). A module without a line has no floor.
#
# Floors sit a few points under the coverage measured on 2026-10-08 so only a real regression trips them; raise a
# floor in the same PR that adds tests. Lowering one needs a reason in the PR.
#
# No floor on purpose: core/testing (test fixtures) and app, app-tv (Application/Activity glue, covered by androidTest
# and the Macrobenchmark module).
core/common=20
core/analytics=5
core/datastore=33
core/database=44
core/ui-tv=83
core/navigation=87
core/security=40
core/ui=70
core/media=8
core/capabilities=60
core/outbox=90
core/network=36
feature/auth=60
feature/admin=26
feature/media=38
feature/search=27
feature/notifications=28
feature/tasks=50
